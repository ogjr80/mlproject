<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Study Guide</title>
<meta name="description" content="A plain-English, interactive study guide to 31 machine learning notebooks: summaries, quizzes, experiments and progress tracking.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
:root {
  --bg: #f5f6f8; --surface: #ffffff; --surface-2: #f0f2f5; --ink: #171a1f; --ink-2: #4a5160; --muted: #6b7382;
  --line: #e3e6eb; --accent: #2457c5; --accent-ink: #ffffff; --accent-soft: #e8eefb;
  --good: #1f8a4c; --good-soft: #e3f3e9; --warn: #a8551d; --warn-soft: #fcefe4;
  --shadow: 0 1px 2px rgba(16, 24, 40, .05), 0 1px 3px rgba(16, 24, 40, .06);
  --shadow-lg: 0 12px 32px rgba(16, 24, 40, .14);
  --radius: 14px; --header: 60px; --sidebar: 300px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101317; --surface: #181c22; --surface-2: #20252d; --ink: #eceef2; --ink-2: #c3c8d1; --muted: #949cab;
    --line: #2a3039; --accent: #7aa7ff; --accent-ink: #0d1626; --accent-soft: #1b2a45;
    --good: #5fcf8d; --good-soft: #17301f; --warn: #f0a46b; --warn-soft: #36261a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  --bg: #101317; --surface: #181c22; --surface-2: #20252d; --ink: #eceef2; --ink-2: #c3c8d1; --muted: #949cab;
  --line: #2a3039; --accent: #7aa7ff; --accent-ink: #0d1626; --accent-soft: #1b2a45;
  --good: #5fcf8d; --good-soft: #17301f; --warn: #f0a46b; --warn-soft: #36261a;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 32px rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--header) + 16px); }
body { margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  font: 16px/1.6 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
h1, h2, h3 { line-height: 1.25; letter-spacing: -.01em; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
code { background: var(--surface-2); border: 1px solid var(--line); padding: 0 5px; border-radius: 5px;
  font: .88em/1.5 ui-monospace, "Cascadia Code", Consolas, monospace; overflow-wrap: anywhere; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- header ---------- */
header { position: sticky; top: 0; z-index: 30; height: var(--header); background: color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter: saturate(1.4) blur(10px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 14px; padding: 0 20px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; color: var(--ink); text-decoration: none; white-space: nowrap; }
.brand .logo { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 16px; }
.hdr-progress { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); white-space: nowrap; }
.meter { width: 160px; height: 8px; border-radius: 99px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; width: 0; background: var(--good); transition: width .4s ease; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface);
  display: grid; place-items: center; flex: none; }
.icon-btn:hover { background: var(--surface-2); }
.menu-btn { display: none; }

/* ---------- layout ---------- */
.layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: calc(100vh - var(--header)); }
aside { position: sticky; top: var(--header); height: calc(100vh - var(--header)); overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--line); padding: 14px 12px 40px; overscroll-behavior: contain; }
.search { position: relative; margin: 2px 4px 12px; }
.search input { width: 100%; height: 38px; padding: 0 12px 0 34px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--surface-2); color: var(--ink); font: inherit; font-size: 14px; }
.search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--surface); }
.search svg { position: absolute; left: 11px; top: 11px; color: var(--muted); }
.search kbd { position: absolute; right: 9px; top: 9px; font: 12px ui-monospace, monospace; color: var(--muted);
  border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--surface); }
.nav-home { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border: 0; border-radius: 9px;
  background: transparent; text-align: left; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
.nav-home:hover, .nav-home.active { background: var(--accent-soft); color: var(--accent); }
.part { margin: 2px 0; }
.part-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 10px; border: 0; border-radius: 9px;
  background: transparent; text-align: left; font-size: 13px; font-weight: 700; color: var(--ink-2); }
.part-head:hover { background: var(--surface-2); }
.part-head .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.part-head .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.part-head .count { font-weight: 600; font-size: 12px; color: var(--muted); }
.part-head .chev { transition: transform .2s; color: var(--muted); }
.part.collapsed .chev { transform: rotate(-90deg); }
.part.collapsed .topics { display: none; }
.topics { list-style: none; margin: 0 0 6px; padding: 0 0 0 14px; }
.topic-link { display: flex; align-items: center; gap: 9px; width: 100%; padding: 6px 10px; border: 0; border-radius: 8px;
  background: transparent; text-align: left; font-size: 14px; color: var(--ink-2); text-decoration: none; }
.topic-link:hover { background: var(--surface-2); color: var(--ink); }
.topic-link.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tick { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line); flex: none; display: grid; place-items: center; }
.done .tick { background: var(--good); border-color: var(--good); }
.done .tick::after { content: ""; width: 7px; height: 4px; border: 2px solid #fff; border-top: 0; border-right: 0; transform: rotate(-45deg) translate(1px, -1px); }
.empty { color: var(--muted); font-size: 14px; padding: 8px 12px; }
.scrim { display: none; }

main { min-width: 0; padding: 32px 40px 96px; }
.wrap { max-width: 860px; margin: 0 auto; }

/* ---------- home ---------- */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 32px; box-shadow: var(--shadow);
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 28px; align-items: center; margin-bottom: 28px; }
.hero h1 { font-size: 32px; margin: 0 0 10px; }
.hero p { margin: 0 0 18px; color: var(--ink-2); font-size: 17px; max-width: 54ch; }
.ring { width: 132px; height: 132px; position: relative; }
.ring svg { transform: rotate(-90deg); }
.ring .lbl { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; }
.ring .lbl b { font-size: 28px; line-height: 1; }
.ring .lbl span { font-size: 12px; color: var(--muted); margin-top: 4px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 10px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--surface-2); }
.btn-done { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }
.home-part { margin-bottom: 26px; }
.home-part h2 { display: flex; align-items: center; gap: 10px; font-size: 18px; margin: 0 0 12px; }
.home-part h2 .dot { width: 11px; height: 11px; border-radius: 4px; }
.home-part h2 small { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--muted); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.tcard { position: relative; display: flex; flex-direction: column; gap: 6px; padding: 14px 16px 14px 18px; border-radius: 12px;
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); text-decoration: none; color: var(--ink);
  transition: transform .15s, box-shadow .15s, border-color .15s; overflow: hidden; }
.tcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.tcard:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
.tcard .num { font-size: 12px; font-weight: 700; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.tcard .num .ok { margin-left: auto; color: var(--good); font-weight: 700; }
.tcard b { font-size: 15px; }
.tcard p { margin: 0; font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* ---------- topic ---------- */
.topbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; font-size: 14px; color: var(--muted); }
.topbar .crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; min-width: 0; }
.topbar .crumb .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.topbar .crumb a { color: var(--muted); text-decoration: none; }
.topbar .crumb a:hover { color: var(--ink); text-decoration: underline; }
.topbar .step { margin-left: auto; display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.topbar .icon-btn { width: 34px; height: 34px; }
.topbar .icon-btn[disabled] { opacity: .35; cursor: default; }
.title { font-size: 36px; margin: 0 0 10px; }
.lead { font-size: 18.5px; color: var(--ink-2); margin: 0 0 22px; max-width: 65ch; }
.facts { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; margin-bottom: 18px; }
.fact { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
.fact h3 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.fact p { margin: 0; font-size: 15px; color: var(--ink-2); }
.fact.wide { grid-column: 1 / -1; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 3px 11px; font-size: 13.5px; font-weight: 500; }
.actions { margin: 4px 0 30px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 18px; overflow-x: auto; scrollbar-width: none; }
.tab { border: 0; background: transparent; text-decoration: none; padding: 10px 14px; font-weight: 600; font-size: 15px; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: flex; align-items: center; gap: 8px; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); }
.tab .pill { font-size: 12px; font-weight: 700; background: var(--surface-2); color: var(--muted); border-radius: 99px; padding: 0 7px; }
.tab[aria-selected="true"] .pill { background: var(--accent-soft); color: var(--accent); }
.hint { margin: 0 0 14px; color: var(--muted); font-size: 14.5px; }
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; box-shadow: var(--shadow); overflow: hidden; }
.q.right { border-color: color-mix(in srgb, var(--good) 55%, var(--line)); }
.q.again { border-color: color-mix(in srgb, var(--warn) 55%, var(--line)); }
.q-head { display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left; border: 0; background: transparent; padding: 16px 18px; }
.q-head .n { flex: none; width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-weight: 700;
  background: var(--surface-2); color: var(--ink-2); }
.q.right .q-head .n { background: var(--good); color: #fff; }
.q.again .q-head .n { background: var(--warn); color: #fff; }
.q-head .txt { flex: 1; font-weight: 600; font-size: 15.5px; }
.q-head .reveal { flex: none; font-size: 13px; font-weight: 600; color: var(--accent); white-space: nowrap; padding-top: 2px; }
.q-body { display: none; padding: 0 18px 16px 56px; color: var(--ink-2); }
.q.open .q-body { display: block; }
.q.open .q-head .reveal { color: var(--muted); }
.grade { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 12px; font-size: 14px; color: var(--muted); }
.grade button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 4px 12px; font-size: 14px; font-weight: 600; }
.grade button:hover { background: var(--surface-2); }
.grade button.on-right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.grade button.on-again { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.try { list-style: none; margin: 0; padding: 0; }
.try li { display: flex; gap: 14px; align-items: flex-start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 18px; margin-bottom: 10px; box-shadow: var(--shadow); }
.try input { flex: none; width: 20px; height: 20px; margin-top: 3px; accent-color: var(--good); cursor: pointer; }
.try li.checked { background: var(--surface-2); }
.try li.checked .t { color: var(--muted); }
.try .t { color: var(--ink-2); min-width: 0; }
.mist { list-style: none; margin: 0; padding: 0; }
.mist li { display: flex; gap: 12px; padding: 14px 18px; margin-bottom: 10px; border-radius: var(--radius); background: var(--warn-soft);
  color: var(--ink-2); border: 1px solid color-mix(in srgb, var(--warn) 25%, transparent); }
.mist li::before { content: "!"; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--warn); color: #fff;
  font-weight: 800; font-size: 13px; display: grid; place-items: center; margin-top: 2px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 36px; padding-top: 22px; border-top: 1px solid var(--line); }
.pager a { display: flex; flex-direction: column; gap: 2px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); text-decoration: none; color: var(--ink); min-width: 0; }
.pager a:hover { border-color: var(--accent); }
.pager a small { color: var(--muted); font-size: 13px; }
.pager a b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pager .next { text-align: right; grid-column: 2; }
.keys { margin-top: 18px; text-align: center; font-size: 13px; color: var(--muted); }
.keys kbd { font: 12px ui-monospace, monospace; border: 1px solid var(--line); border-radius: 5px; padding: 0 5px; background: var(--surface); }

/* ---------- small screens ---------- */
@media (max-width: 900px) {
  :root { --header: 56px; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: grid; }
  header { padding: 0 12px; gap: 10px; }
  .brand .txt { font-size: 16px; }
  .meter { width: 72px; }
  .hdr-progress .label-long { display: none; }
  aside { position: fixed; top: 0; left: 0; bottom: 0; height: 100%; width: min(86vw, 330px); z-index: 50;
    transform: translateX(-102%); transition: transform .25s ease; box-shadow: var(--shadow-lg); padding-top: 16px; }
  body.nav-open aside { transform: none; }
  .scrim { display: block; position: fixed; inset: 0; z-index: 40; background: rgba(10, 14, 20, .45); opacity: 0; pointer-events: none; transition: opacity .25s; }
  body.nav-open .scrim { opacity: 1; pointer-events: auto; }
  main { padding: 20px 16px 72px; }
  .hero { grid-template-columns: minmax(0, 1fr); padding: 22px; gap: 18px; }
  .hero h1 { font-size: 26px; }
  .ring { display: none; }
  .title { font-size: 28px; }
  .lead { font-size: 17px; }
  .facts { grid-template-columns: minmax(0, 1fr); }
  .q-body { padding-left: 18px; }
  .keys { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open topic list" aria-controls="sidebar" aria-expanded="false">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a class="brand" href="#/"><span class="logo" aria-hidden="true">🧭</span><span class="txt">ML Study Guide</span></a>
  <div class="hdr-progress" title="Topics you've marked as done">
    <div class="meter" role="progressbar" aria-label="Topics done" aria-valuemin="0" id="meterWrap"><i id="meter"></i></div>
    <span id="count"></span>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Switch between light and dark mode">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg>
  </button>
</header>
<div class="scrim" id="scrim"></div>
<div class="layout">
  <aside id="sidebar" aria-label="Topics">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <label class="sr-only" for="search">Search topics</label>
      <input id="search" type="search" placeholder="Search topics" autocomplete="off">
      <kbd>/</kbd>
    </div>
    <button class="nav-home" id="navHome">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9h-6v-6H9v6H3z"/></svg>Overview
    </button>
    <nav id="nav"></nav>
  </aside>
  <main id="main" tabindex="-1"><div class="wrap" id="view"></div></main>
</div>
<script>
const DATA = /*__DATA__*/[];
const KEY = 'ml-study-v1';
const PART_COLORS = ['#2e6fba', '#3a9a5b', '#c8453a', '#7b5ea7', '#d08a1e', '#1b8a8f', '#c2457f', '#5b6ee1', '#8a6d3b', '#e07b39'];

// ---------- state (saved in this browser only) ----------
let state = { done: {}, quiz: {}, tried: {}, collapsed: {}, last: null };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

// ---------- data helpers ----------
const parts = [];
DATA.forEach((d, i) => {
  d.index = i;
  d.sectionLabel = (d.section.match(/Section\s+\d+/) || [d.section])[0];
  let p = parts.find(p => p.no === d.partNo);
  if (!p) { p = { no: d.partNo, name: d.part.replace(' _ ', ' & '), topics: [], color: PART_COLORS[parts.length % PART_COLORS.length] }; parts.push(p); }
  p.topics.push(d); d.partRef = p;
});
const byId = id => DATA.find(d => d.id === id);
const doneCount = list => list.filter(d => state.done[d.id]).length;

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
function md(s) {
  return String(s).split(/(`[^`]+`)/g).map(p => p.length > 1 && p[0] === '`' && p.endsWith('`')
    ? '<code>' + esc(p.slice(1, -1)) + '</code>'
    : esc(p).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<em>$2</em>')
            .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
            .replace(/\n/g, '<br>')).join('');
}

// ---------- routing: #/ is the overview, #/t/<id>/<tab> is a topic ----------
function route() {
  const m = location.hash.match(/^#\/t\/([\w-]+)(?:\/(quiz|try|mistakes))?/);
  return m && byId(m[1]) ? { topic: byId(m[1]), tab: m[2] || 'quiz' } : { topic: null };
}
const topicHref = (d, tab) => '#/t/' + d.id + (tab && tab !== 'quiz' ? '/' + tab : '');

// ---------- sidebar ----------
function renderNav() {
  const r = route(), q = document.getElementById('search').value.trim().toLowerCase();
  let html = '';
  parts.forEach(p => {
    const list = p.topics.filter(d => !q || (d.title + ' ' + d.summary + ' ' + d.terms.join(' ') + ' ' + p.name).toLowerCase().includes(q));
    if (!list.length) return;
    const collapsed = !q && state.collapsed[p.no] && !(r.topic && r.topic.partRef === p);
    html += `<div class="part ${collapsed ? 'collapsed' : ''}">
      <button class="part-head" data-part="${esc(p.no)}" aria-expanded="${!collapsed}">
        <svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="m6 9 6 6 6-6"/></svg>
        <span class="dot" style="background:${p.color}"></span><span class="name">${esc(p.name)}</span>
        <span class="count">${doneCount(p.topics)}/${p.topics.length}</span></button>
      <ul class="topics">${list.map(d => `<li><a class="topic-link ${r.topic === d ? 'active' : ''} ${state.done[d.id] ? 'done' : ''}"
        href="${topicHref(d)}" ${r.topic === d ? 'aria-current="page"' : ''}><span class="tick" aria-hidden="true"></span>${esc(d.title)}</a></li>`).join('')}</ul></div>`;
  });
  document.getElementById('nav').innerHTML = html || '<p class="empty">No topics match that search.</p>';
  document.getElementById('navHome').classList.toggle('active', !r.topic);
  const n = doneCount(DATA);
  document.getElementById('meter').style.width = (100 * n / DATA.length) + '%';
  const wrap = document.getElementById('meterWrap');
  wrap.setAttribute('aria-valuemax', DATA.length); wrap.setAttribute('aria-valuenow', n);
  document.getElementById('count').innerHTML = `${n}/${DATA.length}<span class="label-long"> topics done</span>`;
}

// ---------- overview ----------
function renderHome() {
  const n = doneCount(DATA), pct = Math.round(100 * n / DATA.length);
  const next = (state.last && byId(state.last) && !state.done[state.last]) ? byId(state.last) : DATA.find(d => !state.done[d.id]);
  const C = 2 * Math.PI * 56;
  document.title = 'ML Study Guide';
  document.getElementById('view').innerHTML = `
    <section class="hero">
      <div>
        <h1>Learn machine learning, one notebook at a time</h1>
        <p>${DATA.length} topics, from cleaning data to graph transformers. Each one has a plain-English summary, a quiz to check yourself and experiments to try in the notebook. Your progress is saved in this browser.</p>
        <div class="btn-row">
          ${next ? `<a class="btn btn-primary" href="${topicHref(next)}">${n || state.last ? 'Continue' : 'Start'}: ${esc(next.title)} →</a>` : `<span class="btn btn-done">🎉 All ${DATA.length} topics done</span>`}
          <a class="btn btn-ghost" href="https://github.com/ogjr80/mlproject/blob/main/LEARNING_PATH.md" target="_blank" rel="noopener">Learning path ↗</a>
          <a class="btn btn-ghost" href="https://github.com/ogjr80/mlproject/blob/main/GLOSSARY.md" target="_blank" rel="noopener">Glossary ↗</a>
        </div>
      </div>
      <div class="ring" aria-hidden="true">
        <svg width="132" height="132"><circle cx="66" cy="66" r="56" fill="none" stroke="var(--surface-2)" stroke-width="12"/>
          <circle cx="66" cy="66" r="56" fill="none" stroke="var(--good)" stroke-width="12" stroke-linecap="round"
            stroke-dasharray="${C}" stroke-dashoffset="${C * (1 - n / DATA.length)}"/></svg>
        <div class="lbl"><b>${pct}%</b><span>${n} of ${DATA.length} done</span></div>
      </div>
    </section>
    ${parts.map(p => `<section class="home-part">
      <h2><span class="dot" style="background:${p.color}"></span>${esc(p.no)} · ${esc(p.name)}<small>${doneCount(p.topics)} of ${p.topics.length} done</small></h2>
      <div class="grid">${p.topics.map(d => `<a class="tcard" style="--c:${p.color}" href="${topicHref(d)}">
        <span class="num">Topic ${d.index + 1}${state.done[d.id] ? '<span class="ok">✓ Done</span>' : ''}</span>
        <b>${esc(d.title)}</b><p>${esc(d.summary.replace(/[*`]/g, ''))}</p></a>`).join('')}</div></section>`).join('')}`;
}

// ---------- topic ----------
function renderTopic(d, tab) {
  const prev = DATA[d.index - 1], next = DATA[d.index + 1], p = d.partRef;
  document.title = d.title + ' · ML Study Guide';
  const graded = d.quiz.filter((_, k) => state.quiz[d.id + ':' + k] === 'right').length;
  const tried = d.tryThis.filter((_, k) => state.tried[d.id + ':' + k]).length;
  const tabs = [['quiz', 'Check your understanding', `${graded}/${d.quiz.length}`], ['try', 'Try this yourself', `${tried}/${d.tryThis.length}`], ['mistakes', 'Common mistakes', d.mistakes.length]];
  let panel = '';
  if (tab === 'quiz') panel = `<p class="hint">Answer in your head first, then reveal the answer and mark yourself honestly.</p>` +
    d.quiz.map((q, k) => {
      const key = d.id + ':' + k, v = state.quiz[key];
      return `<div class="q ${v === 'right' ? 'right' : v === 'again' ? 'again' : ''}" data-k="${key}">
        <button class="q-head" aria-expanded="false"><span class="n">${k + 1}</span><span class="txt">${md(q.q)}</span><span class="reveal">Show answer</span></button>
        <div class="q-body">${md(q.a)}
          <div class="grade">Did you get it?
            <button data-v="right" class="${v === 'right' ? 'on-right' : ''}">Yes, got it</button>
            <button data-v="again" class="${v === 'again' ? 'on-again' : ''}">Review again</button></div></div></div>`;
    }).join('');
  if (tab === 'try') panel = `<p class="hint">Open the notebook, change one thing, rerun it, and tick it off here.</p><ol class="try">` +
    d.tryThis.map((t, k) => {
      const key = d.id + ':' + k, on = !!state.tried[key];
      return `<li class="${on ? 'checked' : ''}"><input type="checkbox" id="t${k}" data-t="${key}" ${on ? 'checked' : ''}><label class="t" for="t${k}">${md(t)}</label></li>`;
    }).join('') + '</ol>';
  if (tab === 'mistakes') panel = `<p class="hint">The traps beginners fall into most often with this technique.</p><ul class="mist">` +
    d.mistakes.map(m => `<li><span>${md(m)}</span></li>`).join('') + '</ul>';

  document.getElementById('view').innerHTML = `
    <div class="topbar">
      <span class="crumb"><span class="dot" style="background:${p.color}"></span><a href="#/">Overview</a> / <span>${esc(p.no)} · ${esc(p.name)}</span> / <span>${esc(d.sectionLabel)}</span></span>
      <span class="step">Topic ${d.index + 1} of ${DATA.length}
        <a class="icon-btn" ${prev ? `href="${topicHref(prev)}"` : 'aria-disabled="true"'} aria-label="Previous topic" title="Previous (←)" ${prev ? '' : 'style="opacity:.35;pointer-events:none"'}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></a>
        <a class="icon-btn" ${next ? `href="${topicHref(next)}"` : 'aria-disabled="true"'} aria-label="Next topic" title="Next (→)" ${next ? '' : 'style="opacity:.35;pointer-events:none"'}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></a>
      </span>
    </div>
    <h1 class="title">${esc(d.title)}</h1>
    <p class="lead">${md(d.summary)}</p>
    <div class="facts">
      <div class="fact"><h3>When to use it</h3><p>${md(d.whenToUse)}</p></div>
      <div class="fact"><h3>Read first</h3><p>${md(d.readFirst)}</p></div>
      <div class="fact wide"><h3>New words in this topic</h3><div class="chips">${d.terms.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>
    </div>
    <div class="btn-row actions">
      <a class="btn btn-primary" href="${d.url}" target="_blank" rel="noopener">Open the notebook ↗</a>
      <button class="btn ${state.done[d.id] ? 'btn-done' : 'btn-ghost'}" id="doneBtn" aria-pressed="${!!state.done[d.id]}">${state.done[d.id] ? '✓ Done' : 'Mark as done'}</button>
    </div>
    <div class="tabs" role="tablist">${tabs.map(([k, label, pill]) =>
      `<a class="tab" role="tab" href="${topicHref(d, k)}" aria-selected="${tab === k}">${label}<span class="pill">${pill}</span></a>`).join('')}</div>
    <div role="tabpanel">${panel}</div>
    <nav class="pager" aria-label="Previous and next topic">
      ${prev ? `<a href="${topicHref(prev)}"><small>← Previous</small><b>${esc(prev.title)}</b></a>` : '<span></span>'}
      ${next ? `<a class="next" href="${topicHref(next)}"><small>Next →</small><b>${esc(next.title)}</b></a>` : ''}
    </nav>
    <p class="keys">Tip: <kbd>←</kbd> <kbd>→</kbd> move between topics · <kbd>/</kbd> searches</p>`;
}

// ---------- render + events ----------
let lastTopic = null;
function render() {
  const r = route();
  if (r.topic) { state.last = r.topic.id; save(); renderTopic(r.topic, r.tab); } else renderHome();
  renderNav();
  if ((r.topic && r.topic.id) !== lastTopic) {
    window.scrollTo(0, 0);
    const a = document.querySelector('.topic-link.active');
    if (a) a.scrollIntoView({ block: 'nearest' });
  }
  lastTopic = r.topic && r.topic.id;
}
const openNav = open => {
  document.body.classList.toggle('nav-open', open);
  document.getElementById('menuBtn').setAttribute('aria-expanded', open);
};
window.addEventListener('hashchange', () => { openNav(false); render(); });
document.getElementById('menuBtn').addEventListener('click', () => openNav(!document.body.classList.contains('nav-open')));
document.getElementById('scrim').addEventListener('click', () => openNav(false));
document.getElementById('navHome').addEventListener('click', () => { location.hash = '#/'; openNav(false); });
document.getElementById('search').addEventListener('input', renderNav);
document.getElementById('nav').addEventListener('click', e => {
  const h = e.target.closest('.part-head');
  if (h) { state.collapsed[h.dataset.part] = !state.collapsed[h.dataset.part]; save(); renderNav(); }
});
document.getElementById('view').addEventListener('click', e => {
  const t = e.target;
  if (t.closest('#doneBtn')) {
    const r = route(); state.done[r.topic.id] = !state.done[r.topic.id]; save(); render(); return;
  }
  const q = t.closest('.q');
  if (!q) return;
  if (t.closest('.q-head')) {
    const open = q.classList.toggle('open');
    q.querySelector('.q-head').setAttribute('aria-expanded', open);
    q.querySelector('.reveal').textContent = open ? 'Hide' : 'Show answer';
    return;
  }
  const g = t.closest('.grade button');
  if (g) {
    const k = q.dataset.k; state.quiz[k] = state.quiz[k] === g.dataset.v ? undefined : g.dataset.v; save();
    const keepOpen = [...document.querySelectorAll('.q.open')].map(x => x.dataset.k);
    render();
    keepOpen.forEach(k => { const el = document.querySelector(`.q[data-k="${k}"]`); if (el) el.querySelector('.q-head').click(); });
  }
});
document.getElementById('view').addEventListener('change', e => {
  const c = e.target;
  if (!c.dataset.t) return;
  state.tried[c.dataset.t] = c.checked; save();
  c.closest('li').classList.toggle('checked', c.checked);
  const r = route(), tried = r.topic.tryThis.filter((_, k) => state.tried[r.topic.id + ':' + k]).length;
  const pill = document.querySelector('.tab[aria-selected="true"] .pill');
  if (pill) pill.textContent = `${tried}/${r.topic.tryThis.length}`;
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(KEY + '-theme', root.dataset.theme); } catch (e) {}
});
try { const th = localStorage.getItem(KEY + '-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { openNav(false); if (document.activeElement.id === 'search') document.activeElement.blur(); return; }
  if (e.target.matches('input, select, textarea') || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); if (innerWidth <= 900) openNav(true); document.getElementById('search').focus(); return; }
  const r = route();
  const i = r.topic ? r.topic.index : -1;
  if (e.key === 'ArrowRight' && DATA[i + 1]) location.hash = topicHref(DATA[i + 1]);
  if (e.key === 'ArrowLeft' && i > 0) location.hash = topicHref(DATA[i - 1]);
  if (e.key === 'ArrowLeft' && i === 0) location.hash = '#/';
});
render();
</script>
</body>
</html>
