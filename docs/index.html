 the total keeps shrinking. That is why you look for the bend, not the lowest point."}, {"q": "In the final plot, what are the big yellow dots and why do they sit where they do?", "a": "They are the centroids, `kmeans.cluster_centers_`. K-Means keeps moving each centroid to the average position of the customers assigned to it, so each one ends up in the middle of its coloured blob."}, {"q": "What would happen if you set `n_clusters = 200` (one per customer)?", "a": "Every customer would get their own centroid, so WCSS would be 0. But the \"groups\" would tell the mall nothing, because each one is a single person. This is exactly why the elbow method trades tightness for a small number of useful groups."}]}, {"id": "hierarchical_clustering", "title": "Hierarchical Clustering", "part": "Clustering", "partNo": "Part 4", "section": "Section 25 - Hierarchical Clustering", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%204%20-%20Clustering/Section%2025%20-%20Hierarchical%20Clustering/Python/hierarchical_clustering.ipynb", "summary": "Hierarchical clustering builds groups from the bottom up by repeatedly merging the two closest groups, recording every merge in a tree that you can cut to get any number of clusters.", "whenToUse": "Reach for it when you have a small-to-medium dataset and want to see how groups nest inside each other before choosing how many to keep; one limitation is that it gets slow and memory-hungry on large datasets because it compares every pair of points.", "readFirst": "**k_means_clustering**: it uses the same mall customers and the same two columns, and this notebook's 5 groups are meant to be compared with the K-Means result.", "terms": ["hierarchical clustering", "agglomerative", "dendrogram", "linkage", "ward method", "euclidean distance"], "mistakes": ["**Using `affinity = 'euclidean'` from older videos.** Newer scikit-learn renamed it to `metric`, and the old name now raises an error. Use `metric = 'euclidean'` as this notebook does (if a very old scikit-learn rejects `metric`, upgrade it).", "**Changing `metric` while keeping `linkage = 'ward'`.** Ward only works with straight-line (euclidean) distance, so something like `metric = 'manhattan'` with `linkage = 'ward'` raises an error. If you want another distance, switch the linkage too (e.g. `'average'`).", "**Reading the dendrogram's x-axis as meaningful.** The customers along the bottom are re-ordered so the tree can be drawn without crossings; the order is not customer ID. What matters is the height of the joins, because that is the distance between the groups being merged.", "**Using a different linkage in the dendrogram and the model.** If you draw the tree with `method = 'ward'` but train with another `linkage`, the number of clusters you read off the tree may not suit the model. Keep the two settings the same, as the notebook does."], "tryThis": ["In the dendrogram cell, change `sch.linkage(X, method = 'ward')` to `method = 'single'`. What to notice: the tree becomes lopsided, with many short joins and no obvious place to cut. Single linkage only looks at the two closest points of each group, so it tends to chain groups together one customer at a time.", "In the training cell, change `n_clusters = 5` to `n_clusters = 3`, and in the plotting cell remove (or comment out) the cyan and magenta `plt.scatter` lines. What to notice: some of the five blobs merge into bigger groups; compare with the dendrogram, where a higher horizontal cut crosses only 3 vertical lines.", "In the training cell, change `linkage = 'ward'` to `linkage = 'average'` (keep `metric = 'euclidean'`) and re-run the plot. What to notice: the groups can change shape and their sizes may be less even, because Ward deliberately keeps groups compact and average linkage does not.", "Add a new cell after training with `print(np.bincount(y_hc))`. What to notice: you get how many of the 200 customers landed in each of the 5 clusters; the middle-income, middle-spending group should be the largest."], "quiz": [{"q": "Why does the hierarchical clustering plot have no yellow centroids, unlike K-Means?", "a": "Hierarchical clustering never uses centre points. It just keeps merging the closest groups, so there are no centroids to draw."}, {"q": "On the dendrogram, what does a very tall upside-down \"U\" tell you?", "a": "The height of a join is how far apart the two merged groups were. A tall join means two quite different groups were forced together, so cutting below it keeps them apart."}, {"q": "Why do the dendrogram and `AgglomerativeClustering` both use Ward?", "a": "So they agree with each other. The dendrogram is used to pick the number of clusters, and that choice only makes sense if the model merges groups using the same rule."}, {"q": "What would happen if you trained with `n_clusters = 1`?", "a": "The merging would carry on until every customer was in one big group, so `y_hc` would be all zeros and the plot would be a single red cloud. That is the very top of the dendrogram."}]}, {"id": "apriori", "title": "Apriori", "part": "Association Rule Learning", "partNo": "Part 5", "section": "Section 28 - Apriori", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%205%20-%20Association%20Rule%20Learning/Section%2028%20-%20Apriori/Python/apriori.ipynb", "summary": "Apriori finds \"people who buy A also buy B\" rules in shopping baskets and scores each one by how common it is (support), how reliable it is (confidence) and how much stronger than chance it is (lift).", "whenToUse": "Reach for it to plan shelf layouts, bundles or \"customers also bought\" suggestions from transaction data; one limitation is that the results depend heavily on the thresholds you pick, and it shows what is bought together, not why.", "readFirst": "**k_means_clustering** (the idea of unsupervised learning, with no answer column) and **data_preprocessing_tools** (reading a CSV with pandas); the rest of Apriori is new.", "terms": ["association rule", "support", "confidence", "lift", "transaction", "apyori"], "mistakes": ["**Forgetting `header = None`.** Without it, pandas treats the first basket as column names, so that basket is lost and the loop over 7,501 rows runs one past the end of the data and crashes.", "**Sorting by confidence instead of lift.** A very popular item (like mineral water) shows up in so many baskets that almost any rule pointing to it has high confidence. Lift corrects for popularity, so sort by lift to find real links.", "**Thinking `min_length = 2` is what keeps single items out.** apyori does not actually use `min_length`; it is `max_length = 2` plus the `min_lift = 3` filter that leave only pairs. If you remove the lift filter, single-item records can slip in and the `inspect` function crashes with an IndexError.", "**Raising `max_length` and trusting the table.** The `inspect` function only takes the first item on each side (`tuple(...)[0]`) and the first rule of each record (`result[2][0]`), so with 3-item rules the table quietly hides items. Look at the raw `results` when you change rule length."], "tryThis": ["In the training cell, change `min_support = 0.003` to `min_support = 0.005` and re-run every cell below it. What to notice: only the rules whose Support was already 0.005 or more in the table survive (you can predict which ones before running it), because their confidence and lift do not change.", "In the training cell, change `min_confidence = 0.2` to `min_confidence = 0.35` and re-run the cells below. What to notice: only the rules whose Confidence was 0.35 or more are left (pasta → escalope and tomato sauce → ground beef), showing how quickly a high bar removes rules.", "In the last cell, change `nlargest(n = 10, columns = 'Lift')` to `columns = 'Support'`. What to notice: herb & pepper → ground beef jumps from near the bottom to the top. A strong link (lift) and a common pair (support) are different things.", "In a new cell, run `print(sum('nan' in t for t in transactions))`. What to notice: most baskets contain the fake `'nan'` item made from empty slots, yet it never appears in the rules. Because it is in almost every basket, it cannot make any other item noticeably more likely, so its lift stays far below 3."], "quiz": [{"q": "Why does the notebook use lift and not just confidence?", "a": "Confidence can be high simply because the second item is very popular. Lift compares the chance of buying B after A with the normal chance of buying B, so it only rewards real links. A lift of 3 means B is 3 times more likely than usual."}, {"q": "Read the sorted table: which rule has the strongest link, and what does its lift mean?", "a": "fromage blanc → honey, with lift about 5.16. Customers who buy fromage blanc are about 5 times more likely to buy honey than a random customer."}, {"q": "In the light cream → chicken row, what does the support of about 0.0045 mean in plain words?", "a": "About 0.45% of all 7,501 baskets (roughly 34 baskets) contain both light cream and chicken."}, {"q": "What would happen if you set `min_support = 0.02`?", "a": "No rules would come out at all. The highest support in the table is about 0.016 (herb & pepper and ground beef), so every pair would fall below the bar and the table would be empty."}]}, {"id": "eclat", "title": "Eclat", "part": "Association Rule Learning", "partNo": "Part 5", "section": "Section 29 - Eclat", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%205%20-%20Association%20Rule%20Learning/Section%2029%20-%20Eclat/Python/eclat.ipynb", "summary": "Eclat finds sets of items that are often bought together and ranks them purely by how often they appear together (support).", "whenToUse": "Reach for it when you just want a quick list of the most common item combinations, for example to pick bundles or shelf neighbours; one limitation is that support alone favours popular items and says nothing about whether one item actually leads to the other.", "readFirst": "**apriori**: this notebook uses the same baskets, the same preprocessing and even the same `apriori` function call, and only changes how the results are read.", "terms": ["eclat", "itemset", "support", "frequent pair"], "mistakes": ["**Reading Product 1 → Product 2 as a direction.** Eclat only measures how often two items appear together, so \"herb & pepper + ground beef\" is the same as \"ground beef + herb & pepper\". The columns are just the two members of a pair.", "**Thinking this is a separate Eclat library.** It is the apyori `apriori` function with confidence and lift left out of the table. Because `min_confidence = 0.2` and `min_lift = 3` are still in the call, you get the same 9 pairs as Apriori, not every frequent pair.", "**Deleting the confidence and lift settings and expecting a longer, clean table.** apyori then also lets single items through (it ignores `min_length`), and `inspect` crashes with an IndexError because a single item has nothing on its left side. Filter to pairs first (see the second try-this idea).", "**Assuming the top pair is automatically the most useful.** High support means the pair is common, not that the link is strong. herb & pepper + ground beef has the highest support here but one of the lowest lifts in the Apriori notebook."], "tryThis": ["In the training cell, change `min_support = 0.003` to `min_support = 0.006` and re-run the cells below. What to notice: only the top two pairs from the table (herb & pepper + ground beef, whole wheat pasta + olive oil) remain, because every other pair had support below 0.006.", "In the training cell, delete `min_confidence = 0.2, min_lift = 3, ` so only the support and length settings are left, and in the cell `results = list(rules)` add a second line `results = [r for r in results if len(r.items) == 2]`. Re-run the cells below. What to notice: you get many more pairs, and the fake `'nan'` item (from empty basket slots) and very popular items like mineral water are likely to crowd the top, which is why the notebook keeps the lift filter.", "In the last cell, change `nlargest(n = 10, columns = 'Support')` to `nlargest(n = 3, columns = 'Support')`. What to notice: you get just the three most common pairs; this is how you would pick a few pairs for a promotion.", "In a new cell, run `print(round(0.015998 * 7501))`. What to notice: turning support back into a count shows that the top pair appears in roughly 120 baskets, which is easier to picture than a small decimal."], "quiz": [{"q": "What is the one score Eclat cares about, and what does it mean?", "a": "Support: the share of all baskets that contain both items. A support of 0.008 means about 0.8% of baskets (around 60 of 7,501) have both."}, {"q": "Why does this notebook get exactly the same 9 pairs as the Apriori notebook?", "a": "Because it runs the same `apriori` call with the same thresholds, including the confidence and lift filters. Only the table changes: it keeps the support column and sorts by it."}, {"q": "Reading the table, which pair only just made it in, and how can you tell?", "a": "light cream + olive oil, with support about 0.0032. The minimum allowed was 0.003, so it barely cleared the bar."}, {"q": "What would happen if you removed the lift and confidence filters but changed nothing else?", "a": "apyori would also return single items, and the `inspect` function would crash with an IndexError when it tries to take the first item of an empty left side. With a pairs-only filter added, you would instead see many more pairs, including ones with the fake `'nan'` item."}]}, {"id": "upper_confidence_bound", "title": "Upper Confidence Bound (UCB)", "part": "Reinforcement Learning", "partNo": "Part 6", "section": "Section 32 - Upper Confidence Bound (UCB)", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%206%20-%20Reinforcement%20Learning/Section%2032%20-%20Upper%20Confidence%20Bound%20(UCB)/Python/upper_confidence_bound.ipynb", "summary": "UCB decides which of several options to try next by picking the one with the best \"average so far plus an uncertainty bonus\" score, so it learns which option is best while wasting as few tries as possible.", "whenToUse": "Reach for UCB when you must learn on the fly which of a few choices works best, such as ads, email subject lines or website layouts, and every bad choice costs you something; one limitation is that it assumes each option's success rate stays the same over time, so it adapts poorly if tastes change.", "readFirst": "**data_preprocessing_tools**, just for reading a CSV with pandas. This is the first reinforcement learning notebook, so it does not build on the regression, classification or clustering models. Expect a different setup: no X, no y, no train/test split.", "terms": ["reinforcement learning", "multi-armed bandit", "exploration vs exploitation", "reward", "upper confidence bound"], "mistakes": ["**Treating the CSV as a training set.** It is tempting to just add up each column and pick the ad with the most clicks. That works here only because every answer is written down in advance. In real life you only see the click for the one ad you showed, so the code must read only `dataset.values[n, ad]` and never peek at the other nine ads.", "**Setting `N` larger than the data.** The table has 10,000 rows. If you set `N = 20000`, `dataset.values[n, ad]` runs past the last row and crashes with an `IndexError`. Keep `N` at 10,000 or less.", "**Forgetting the \"never shown\" case.** If you remove the `else: upper_bound = 1e400` branch, the code would divide by `numbers_of_selections[i]` while it is still 0 and crash. That branch also makes sure every ad is tried once before any are judged.", "**Reading the x-axis as 1 to 10.** Python counts from 0, so the tall bar at **4** is *Ad 5*, not Ad 4. Add 1 to the bar position to get the ad's real name."], "tryThis": ["In the **Implementing UCB** cell, change `N = 10000` to `N = 500` (then try `N = 1000`), and re-run that cell and the histogram. What to notice: with only 500 visitors the bars are much more even and the winner may not stand out yet. UCB needs enough rounds to gather evidence before it commits.", "Add a new cell after the UCB loop with `print(total_reward)` and `print(numbers_of_selections)`. What to notice: you see the total clicks earned and exactly how many times each ad was shown. Ad 5 (position 4 in the list) should have by far the most showings.", "In the line `delta_i = math.sqrt(3/2 * math.log(n + 1) / numbers_of_selections[i])`, change `3/2` to `0.1`, re-run, and check `total_reward`. Then try `10`. What to notice: a small number means a small bonus, so less exploring. A big number means a big bonus, so UCB keeps trying weak ads much longer and the other bars grow. This shows how the bonus controls exploring vs exploiting.", "Add a new cell with `print(dataset.sum())`. What to notice: this \"cheats\" by looking at every ad's full column of clicks. Ad 5 should have the highest total, which confirms that UCB found the right winner without ever seeing the full table."], "quiz": [{"q": "Why does an ad that has never been shown get a score of `1e400`?", "a": "`1e400` is so big that Python treats it as infinity, so an untried ad always beats the others. This makes sure every ad gets shown at least once in the first 10 rounds. It also avoids dividing by zero, since the formula divides by the number of times the ad has been shown."}, {"q": "Why does the uncertainty bonus `delta_i` get smaller as an ad is shown more often?", "a": "The bonus divides by `numbers_of_selections[i]`. The more times we have shown an ad, the more we trust its average click rate, so we need less of an \"it might be better than it looks\" bonus. Over time an ad's score settles close to its true click rate."}, {"q": "Looking at the histogram, what does one very tall bar at position 4 tell you?", "a": "It means UCB settled on ad 4, which is *Ad 5*, as the winner and showed it to most visitors (about 6,300 of the 10,000 according to the notebook). The short bars are the showings spent exploring the other ads before UCB was confident they were worse."}, {"q": "What would happen if you removed `delta_i` and used only `upper_bound = average_reward`?", "a": "UCB would always pick whichever ad looks best right now, with no reason to try others again. After the first 10 rounds it could get stuck on an ad that was lucky early on, even if it is not really the best. You lose the exploring part, which is what makes UCB find the true winner."}]}, {"id": "thompson_sampling", "title": "Thompson Sampling", "part": "Reinforcement Learning", "partNo": "Part 6", "section": "Section 33 - Thompson Sampling", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%206%20-%20Reinforcement%20Learning/Section%2033%20-%20Thompson%20Sampling/Python/thompson_sampling.ipynb", "summary": "Thompson Sampling picks which option to try next by drawing a random guess of each option's success rate from its record of wins and losses and choosing the highest guess, so promising options get used more and uncertain ones still get the odd try.", "whenToUse": "Use it for live A/B-style decisions such as which ad, product or headline to show, where you want to find the best option quickly and waste few tries; one limitation is that its results are random, so two runs can differ, and like UCB it assumes the success rates do not change over time.", "readFirst": "**upper_confidence_bound**, because it solves the exact same 10-ads problem with the same data and loop structure. Here you will see a different, random way of choosing which ad to show.", "terms": ["thompson sampling", "beta distribution", "random draw (sampling)", "deterministic vs random algorithm", "wins and losses"], "mistakes": ["**Expecting the same result every run.** Thompson Sampling uses random draws and the notebook has no `random.seed`, so the bar heights and `total_reward` change a little each time. That is normal, not a bug. If you need repeatable results, add `random.seed(0)` before the loop.", "**Dropping the `+ 1`s in `random.betavariate(...)`.** For an ad with no history, both counts are 0, and `betavariate(0, 0)` is not allowed and raises an error. The `+ 1`s give every ad a fair starting belief of \"anywhere from 0 to 1\".", "**Mixing up the two counters.** `numbers_of_rewards_1` counts clicks (wins) and `numbers_of_rewards_0` counts no-clicks (losses). If you swap them in the `betavariate` call, the algorithm will favour the ads that fail most and end up choosing the worst ad.", "**Thinking it looks at the whole table.** As with UCB, each round reads only `dataset.values[n, ad]` for the chosen ad. Summing the columns would give the answer away, but that is not possible in real life, where you only see the result of the ad you showed."], "tryThis": ["Add `print(total_reward)` at the end of the **Implementing Thompson Sampling** cell, then re-run that cell and the histogram cell two or three times without changing anything else. What to notice: the bars and the total change slightly each run, because the choices depend on random draws. Ad 5 (bar 4) should still win every time.", "Change `N = 10000` to `N = 500`, re-run, and compare the histogram with UCB's at the same `N`. What to notice: Thompson Sampling often picks out the winner in fewer rounds, so even at 500 the bar for ad 4 may already stand out.", "Add `random.seed(0)` on the line right after `import random`, then run the loop cell twice. What to notice: now both runs give exactly the same picks and the same `total_reward`. A seed fixes the random numbers so results can be repeated.", "In a new cell after the loop, run `print(numbers_of_rewards_1)` and `print(numbers_of_rewards_0)`. What to notice: Ad 5 (position 4) has many wins and many losses because it was shown so often, while the weak ads have only a handful of each. Few showings means a wide, uncertain belief."], "quiz": [{"q": "Why does Thompson Sampling still try weak ads now and then, even without a bonus like UCB's?", "a": "An ad with little history has a wide Beta distribution, so its random guesses jump around. Now and then it draws a high number and beats the others, so it gets a turn. Exploring happens by chance rather than through a bonus formula."}, {"q": "What does `random.betavariate(wins + 1, losses + 1)` give you, in plain words?", "a": "It gives one random guess between 0 and 1 of the ad's true click rate, based on its wins and losses so far. With many showings the guesses stay close to the real click rate. With few showings they are spread out."}, {"q": "The histogram has one bar towering at position 4. Which ad is it, and does it match UCB?", "a": "Position 4 is *Ad 5*, because Python counts from 0. It is the same winner UCB found, and it has the highest click rate in the data (about 27%). The bar heights will differ a little from run to run because the method is random."}, {"q": "What would happen if you replaced the Beta draw with the plain average `wins / (wins + losses)` for each ad?", "a": "There would be no randomness, so the algorithm would always pick the ad that looks best right now. It could get stuck on an ad that was lucky early on and stop trying the others. It would also crash on untried ads, because wins + losses would be 0 and you can't divide by zero."}]}, {"id": "natural_language_processing", "title": "Natural Language Processing", "part": "Natural Language Processing", "partNo": "Part 7", "section": "Section 36 - Natural Language Processing", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%207%20-%20Natural%20Language%20Processing/Section%2036%20-%20Natural%20Language%20Processing/Python/natural_language_processing.ipynb", "summary": "This notebook teaches a computer to tell positive from negative restaurant reviews by cleaning the text down to root words, counting how often each word appears (bag of words), and training a Naive Bayes classifier on those counts.", "whenToUse": "Use this bag-of-words approach for quick, simple text sorting jobs such as tagging reviews, support tickets or emails as positive/negative or by topic; one limitation is that it ignores word order and context, so it misses sarcasm and phrases like \"not bad at all\".", "readFirst": "**naive_bayes**, because the same `GaussianNB` classifier and confusion matrix are used here. Also **data_preprocessing_template**, which shows the train/test split. Once the text is turned into numbers, this is a normal classification problem.", "terms": ["stopwords", "stemming", "corpus", "bag of words", "regular expression", "CountVectorizer"], "mistakes": ["**Removing \"not\" along with the other stopwords.** The standard English stopword list includes \"not\", so without `all_stopwords.remove('not')`, *\"not good\"* turns into just *\"good\"*. The model would then read a negative review as positive. Always check whether a stopword list throws away words that matter for your task.", "**Reading the .tsv like a CSV.** Calling `pd.read_csv('Restaurant_Reviews.tsv')` without `delimiter = '\\t'` makes pandas split on commas, which jumbles the reviews. Leaving out `quoting = 3` can let stray `\"` characters break rows. Keep both settings.", "**Cleaning new reviews differently from the training reviews.** To predict a brand-new review, you must run it through the exact same steps (letters only, lowercase, remove stopwords except \"not\", stem). Then turn it into numbers with `cv.transform(...)`, not `fit_transform`. Using `fit_transform` again would build a different word list, so the columns would no longer line up with what the model learned.", "**Judging the model by accuracy alone.** 73% sounds fine, but the confusion matrix shows 42 negative reviews wrongly called positive, and only 12 errors the other way. Always look at where the mistakes fall, not just the overall score."], "tryThis": ["In the **Bag of Words** cell, change `max_features = 1500` to `max_features = 500`, then re-run that cell and all the cells below it. What to notice: compare the new confusion matrix and accuracy with the original 73%. Keeping fewer words makes the table smaller. It may lose some useful words, or it may cut noise.", "In the **Cleaning the texts** cell, put a `#` in front of `all_stopwords.remove('not')` and re-run everything from there down. What to notice: in `print(corpus)`, *'crust not good'* becomes *'crust good'*. Check whether the accuracy changes. It shows why keeping \"not\" matters for sentiment.", "In the **Training** cell, replace `from sklearn.naive_bayes import GaussianNB` and `classifier = GaussianNB()` with `from sklearn.naive_bayes import MultinomialNB` and `classifier = MultinomialNB()`, then re-run the cells below. What to notice: MultinomialNB is designed for word counts, so compare its confusion matrix with GaussianNB's. Look especially at the 42 \"wrongly called liked\" errors.", "Add a new cell at the end to test your own review. Clean it with the same steps as the loop: `new_review = re.sub('[^a-zA-Z]', ' ', 'I did not like the food').lower().split()`, then `new_review = [ps.stem(word) for word in new_review if not word in set(all_stopwords)]`, then `print(classifier.predict(cv.transform([' '.join(new_review)]).toarray()))`. What to notice: you must use `cv.transform`, not `fit_transform`. The model may also get short or unusual sentences wrong, since it only knows the words it saw in 800 training reviews."], "quiz": [{"q": "Why is stemming useful here?", "a": "Stemming cuts words down to their root, so \"loved\", \"loving\" and \"loves\" all become \"love\". They then share one column instead of three, which makes the table smaller and lets the model learn that all those forms mean the same thing. The stems don't have to be real words (\"tasty\" becomes \"tasti\"), as long as they are consistent."}, {"q": "What does the shape of `X` (1,000 rows × 1,500 columns) mean?", "a": "Each row is one review and each column is one of the 1,500 most common words. Each cell counts how many times that word appears in that review. Most cells are 0, because a short review uses only a few of the 1,500 words."}, {"q": "Read the confusion matrix `[[55 42] [12 91]]`. What is the model's main weakness?", "a": "Rows are the real answers and columns are the predictions. The 42 in the top-right means 42 reviews that were really negative were predicted as positive. That is far more than the 12 positive reviews called negative, so the model leans too much towards guessing \"liked\"."}, {"q": "What would happen if you skipped `.lower()` in the cleaning loop?", "a": "\"Great\" and \"great\" would be counted as two different words and get separate columns. The evidence for one word would be split in two, and the 1,500 columns would fill up with duplicates. The model would probably learn a little less well."}]}, {"id": "artificial_neural_network", "title": "Artificial Neural Network", "part": "Deep Learning", "partNo": "Part 8", "section": "Section 39 - Artificial Neural Networks (ANN)", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%208%20-%20Deep%20Learning/Section%2039%20-%20Artificial%20Neural%20Networks%20(ANN)/Python/artificial_neural_network.ipynb", "summary": "An artificial neural network passes the inputs through layers of simple weighted calculators and keeps adjusting the weights until its predictions match the real answers.", "whenToUse": "Reach for an ANN when you have plenty of data and the pattern may be too complex for simpler models; the downside is that it is slower to train, needs careful scaling, and is hard to explain why it made a particular decision.", "readFirst": "**data_preprocessing_tools** (label encoding, one-hot encoding and feature scaling are all reused here) and **logistic_regression** (the sigmoid output and the 0.5 cut-off work the same way).", "terms": ["neuron", "hidden layer", "activation function (relu, sigmoid)", "epoch", "batch size", "loss (binary cross-entropy)"], "mistakes": ["**Skipping feature scaling.** Without `StandardScaler`, big columns like Balance (up to six figures) swamp small ones like HasCrCard (0 or 1), and training becomes slow and unstable. For neural networks, always scale the inputs.", "**Feeding a new customer in the wrong format.** `predict` expects the exact column layout of the training data: the three one-hot country columns first, Gender as 0/1, then the rest in order, all wrapped in `[[...]]` and passed through `sc.transform`. Typing `'France'` or forgetting `sc.transform` gives an error or a meaningless answer.", "**Calling `sc.fit_transform` on the test set or on a single new customer.** That re-learns the averages from different data, so the scaling no longer matches what the network learned on. Use `fit_transform` once on `X_train`, and only `transform` afterwards.", "**Trusting accuracy alone.** About 4 in 5 customers stay, so a model that always says \"stays\" already scores around 80%. Check the confusion matrix too: here 200 of the 405 real leavers were missed."], "tryThis": ["In the training cell, change `epochs = 100` to `epochs = 10`. First re-run the build cells from `ann = tf.keras.models.Sequential()` onward so you start from a fresh network, then retrain and re-run everything below. What to notice: the final training accuracy and the test accuracy from `accuracy_score`. Is the score much worse, or did most of the learning happen early?", "In both hidden-layer cells, change `units=6` to `units=32`, rebuild the network from `Sequential()` and retrain. What to notice: whether the training accuracy creeps above the test accuracy. A growing gap between them is a sign the network is starting to memorise the training customers.", "In the \"Predicting the Test set results\" cell, change `y_pred = (y_pred > 0.5)` to `y_pred = (y_pred > 0.3)` and re-run it and the confusion matrix cell. What to notice: the bottom-right number (leavers correctly caught) should go up, but the top-right number (stayers wrongly flagged) also goes up, and accuracy may drop. A lower cut-off trades more false alarms for catching more leavers.", "In the single-prediction cell, remove `> 0.5` so it prints the raw probability, and change the age from `40` to `60` (the 6th number): `print(ann.predict(sc.transform([[1, 0, 0, 600, 1, 60, 3, 60000, 2, 1, 1, 50000]])))`. What to notice: how the predicted chance of leaving changes when only the age changes."], "quiz": [{"q": "Why does the output layer use `sigmoid` while the hidden layers use `relu`?", "a": "The output must be a probability, and sigmoid always gives a number between 0 and 1. The hidden layers just need to pass useful signals along, and relu (negative becomes 0, positive passes through) is simple and fast for that."}, {"q": "Each training line shows `250/250`. Where does 250 come from?", "a": "There are 8,000 training customers and `batch_size = 32`, so one epoch is 8,000 ÷ 32 = 250 batches. The network updates its weights once per batch, so 250 times per epoch."}, {"q": "The confusion matrix is `[[1516 79] [200 205]]`. What does the 200 mean, and why does it matter for the bank?", "a": "200 customers really left but the network predicted they would stay. Those are exactly the customers the bank wants to catch, so even with 86% accuracy the model misses about half of the leavers (it catches 205 of 405)."}, {"q": "What would happen if you removed the second hidden layer and kept everything else the same?", "a": "The network would still train, and on a fairly simple table like this it may score in a similar range, because one hidden layer can already learn a lot. It would just have less ability to combine simple patterns into more complex ones. Try it and compare the accuracy."}]}, {"id": "convolutional_neural_network", "title": "Convolutional Neural Network", "part": "Deep Learning", "partNo": "Part 8", "section": "Section 40 - Convolutional Neural Networks (CNN)", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%208%20-%20Deep%20Learning/Section%2040%20-%20Convolutional%20Neural%20Networks%20(CNN)/Python/convolutional_neural_network.ipynb", "summary": "A convolutional neural network slides small learned pattern detectors over an image to find features like edges and shapes, then uses an ordinary neural network to classify the image from those features.", "whenToUse": "Use a CNN for image tasks like recognising objects, animals or defects in photos; the limitation is that it needs many labelled images and a lot of computing time to train well.", "readFirst": "**artificial_neural_network**, because a CNN ends with the same Dense layers, sigmoid output, adam optimiser and binary cross-entropy loss; this notebook only adds the image-specific front part.", "terms": ["convolution", "filter (feature detector)", "max pooling", "flattening", "image augmentation", "overfitting"], "mistakes": ["**Forgetting to scale the new photo.** The training photos were scaled with `rescale = 1./255`, so the single photo must be divided by 255 too (`test_image / 255.0`). If you skip it, the network sees pixel values up to 255 instead of up to 1, and its answer is unreliable.", "**Mixing up which number means cat and which means dog.** Keras numbers the classes from the folder names in alphabetical order, so `{'cats': 0, 'dogs': 1}`. Print `training_set.class_indices` to check before reading the result, especially if you rename the folders.", "**Augmenting the test set.** Shearing, zooming and flipping belong only in `train_datagen`. The test set should only be rescaled, so it measures the network on photos as they really are.", "**Changing the image size in only one place.** `target_size = (64, 64)` appears in both generators and in `image.load_img`, and `input_shape=[64, 64, 3]` is in the first Conv2D layer. If they don't all match, you get a shape error."], "tryThis": ["You need the `dataset/` folder of cat and dog photos (see the first explanation cell) for all of these. In the training cell, change `epochs = 25` to `epochs = 5` (rebuild from `cnn = tf.keras.models.Sequential()` first). What to notice: compare `accuracy` and `val_accuracy` on the last line with a 25-epoch run. Fewer passes should leave both lower.", "In the training-set preprocessing cell, turn augmentation off by changing it to `train_datagen = ImageDataGenerator(rescale = 1./255)`, then rebuild the CNN and retrain. What to notice: training `accuracy` will likely climb higher, but watch whether `val_accuracy` falls further behind it. That growing gap is overfitting.", "Add a third convolution and pooling round: after the second-layer cell, add a cell with `cnn.add(tf.keras.layers.Conv2D(filters=32, kernel_size=3, activation='relu'))` and `cnn.add(tf.keras.layers.MaxPool2D(pool_size=2, strides=2))`, then run the remaining build cells and retrain. What to notice: whether `val_accuracy` changes. The feature maps shrink to 6 × 6, so Flatten now gives far fewer numbers than 6,272.", "In the single-prediction cell, add `print(result[0][0])` after `result = cnn.predict(test_image)`, and try a few of your own photos by changing the file path. What to notice: values near 0 or 1 mean the network is confident; values near 0.5 mean it is unsure."], "quiz": [{"q": "Why is the test set only rescaled, with no shear, zoom or flip?", "a": "Augmentation is a training trick to stop the network memorising exact photos. The test set stands in for real, new photos, so we want to judge the network on them as they are, not on altered copies."}, {"q": "What does max pooling do to a 62 × 62 feature map here, and why is that useful?", "a": "With `pool_size=2` and `strides=2` it keeps only the biggest number in each 2 × 2 square, shrinking the map to 31 × 31. That means fewer numbers to process, and the network cares less about the exact position of a feature."}, {"q": "If `result[0][0]` is 0.92, what does the notebook print, and why?", "a": "It prints `dog`. 0.92 is above 0.5, and the folders were numbered alphabetically (`cats` = 0, `dogs` = 1), so values near 1 mean dog."}, {"q": "What would happen if training `accuracy` reached 98% but `val_accuracy` stayed around 75%?", "a": "The network would be overfitting: memorising the training photos rather than learning what cats and dogs look like in general. More augmentation, more training photos or fewer epochs are common ways to narrow the gap."}]}, {"id": "principal_component_analysis", "title": "Principal Component Analysis (PCA)", "part": "Dimensionality Reduction", "partNo": "Part 9", "section": "Section 43 - Principal Component Analysis (PCA)", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%209%20-%20Dimensionality%20Reduction/Section%2043%20-%20Principal%20Component%20Analysis%20(PCA)/Python/principal_component_analysis.ipynb", "summary": "PCA squeezes many columns into a few new ones, each a mix of the originals, chosen to keep as much of the data's spread as possible, without looking at the labels.", "whenToUse": "Use PCA when you have many related numeric columns and want a simpler, faster model or a 2D picture of the data; the limitation is that the new columns are hard to interpret and it can only find straight-line directions.", "readFirst": "**logistic_regression**, because PCA here only prepares the data and logistic regression does the classifying, with the same coloured decision-region charts.", "terms": ["dimensionality reduction", "principal component", "variance (spread)", "unsupervised", "data leakage"], "mistakes": ["**Running PCA without scaling first.** PCA chases the biggest spread, and Proline is in the hundreds or thousands while Hue is around 1. Unscaled, PC1 would mostly just be Proline. Always run `StandardScaler` before PCA.", "**Fitting PCA on the test set.** Use `pca.fit_transform(X_train)` and then only `pca.transform(X_test)`. Fitting on the test data lets information about the \"unseen\" wines leak into the model and makes the score look better than it really is.", "**Thinking PC1 and PC2 are original measurements.** Each principal component is a weighted mix of all 13 columns, so you can't say \"PC1 is alcohol\". Look at `pca.components_` if you want to see the weights.", "**Assuming 2 components is always enough.** It works well on this wine data, but on other data 2 components might keep only a small share of the information. Check `pca.explained_variance_ratio_` before trusting the result."], "tryThis": ["After the \"Applying PCA\" cell, add a new cell with `print(pca.explained_variance_ratio_)` and `print(pca.explained_variance_ratio_.sum())`. What to notice: how much of the wines' total spread PC1 and PC2 each keep, and what share of the original information the 2 columns hold together.", "In the \"Applying PCA\" cell, change `PCA(n_components = 2)` to `PCA(n_components = 1)`, then re-run from the top through the confusion matrix (skip the two chart cells, which need 2 columns). What to notice: whether accuracy drops from 0.972 when the wines are squeezed onto a single line.", "Comment out the four lines of the Feature Scaling cell (put `#` in front of each) and re-run from the top through the confusion matrix and charts. What to notice: the accuracy and the axis ranges on the chart. Without scaling, PCA mostly follows the big-number Proline column.", "In the \"Applying PCA\" cell, change `n_components = 2` to `n_components = 5` and re-run down to the confusion matrix (the charts won't work with 5 columns). What to notice: whether keeping more components fixes the one wine that was misclassified."], "quiz": [{"q": "Why does `pca.fit_transform` receive only `X_train` and never `y_train`?", "a": "PCA is unsupervised: it only looks at how the wines differ chemically and finds the directions of biggest spread. It never uses the customer segments, which is the key difference from LDA."}, {"q": "The confusion matrix is `[[14 0 0] [1 15 0] [0 0 6]]`. What went wrong, and what is the accuracy?", "a": "One wine that was really segment 2 was predicted as segment 1. The other 35 were right, so accuracy is 35 ÷ 36 ≈ 0.972, about 97%."}, {"q": "In the charts, what do the coloured background and the dots each show?", "a": "The background shows what the model would predict at every point on the PC1/PC2 map (red = 1, green = 2, blue = 3). The dots are real wines coloured by their true segment, so a dot on a different colour is a mistake."}, {"q": "What would happen if you skipped feature scaling before PCA?", "a": "PCA would treat Proline as by far the most varied column just because its numbers are bigger, so PC1 would mostly be Proline and the other measurements would be largely ignored. The two components would carry less useful information about the segments."}]}, {"id": "linear_discriminant_analysis", "title": "Linear Discriminant Analysis (LDA)", "part": "Dimensionality Reduction", "partNo": "Part 9", "section": "Section 44 - Linear Discriminant Analysis (LDA)", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%209%20-%20Dimensionality%20Reduction/Section%2044%20-%20Linear%20Discriminant%20Analysis%20(LDA)/Python/linear_discriminant_analysis.ipynb", "summary": "LDA squeezes many columns into a few new ones chosen specifically to push the known groups as far apart as possible.", "whenToUse": "Use LDA when you have labelled groups and want fewer inputs that keep the groups well separated, often before a simple classifier; the limitation is that it can make at most (number of classes − 1) directions and only finds straight-line separations.", "readFirst": "**principal_component_analysis**, because this notebook uses the same wine data and the same steps, and the main lesson is how LDA differs from PCA by using the labels.", "terms": ["linear discriminant", "supervised dimensionality reduction", "class separation", "decision boundary"], "mistakes": ["**Passing `y_test` into the test-set step.** The test labels must stay hidden. Only training uses the labels (`lda.fit_transform(X_train, y_train)`); the test set is converted with `lda.transform(X_test)` alone.", "**Forgetting `y_train` in `fit_transform`.** Unlike PCA, LDA needs the labels to learn. Calling `lda.fit_transform(X_train)` without `y_train` raises an error.", "**Asking for too many components.** LDA can make at most (number of classes − 1) directions. With 3 segments that is 2, so `n_components = 3` gives an error.", "**Reading 100% test accuracy as a guarantee.** The test set is only 36 wines. A different shuffle could easily produce one or two mistakes, so treat the perfect score as \"very good on this split\", not \"always perfect\"."], "tryThis": ["In the \"Applying LDA\" cell, change `LDA(n_components = 2)` to `LDA(n_components = 3)` and run it. What to notice: the error message. With 3 segments, LDA can only make 3 − 1 = 2 directions.", "In the splitting cell, change `random_state = 0` to `random_state = 1` (then try `2` and `3`), and re-run from there through the confusion matrix. What to notice: whether the accuracy stays at 1.0 or a wine or two get misclassified on a different shuffle.", "Compare with PCA directly: in the \"Applying LDA\" cell, replace the code with `from sklearn.decomposition import PCA`, `lda = PCA(n_components = 2)`, `X_train = lda.fit_transform(X_train)`, `X_test = lda.transform(X_test)`, and re-run everything below. What to notice: the accuracy, and how tightly the three colours clump in the training chart compared with the LDA version.", "In the \"Applying LDA\" cell, change `n_components = 2` to `n_components = 1`, then re-run down to the confusion matrix (skip the charts, which need 2 columns). What to notice: how much accuracy you keep with just one direction (LD1)."], "quiz": [{"q": "What is the key difference between LDA and PCA?", "a": "PCA ignores the labels and keeps the directions where the data is most spread out. LDA uses the labels and keeps the directions that best separate the groups. So LDA is supervised and PCA is unsupervised."}, {"q": "Why does the code use exactly 2 components here?", "a": "With 3 customer segments, LDA can make at most 3 − 1 = 2 useful directions. Two is also exactly what we need to draw a flat chart."}, {"q": "The confusion matrix is `[[14 0 0] [0 16 0] [0 0 6]]`. What does that tell you?", "a": "Every test wine is on the diagonal: 14 of segment 1, 16 of segment 2 and 6 of segment 3, all correct, so accuracy is 36 ÷ 36 = 1.0. PCA on the same split made one mistake."}, {"q": "What would happen if you accidentally wrote `X_test = lda.fit_transform(X_test, y_test)` instead of `lda.transform(X_test)`?", "a": "LDA would re-learn its directions from the test wines and their answers, so the test set would no longer be unseen. The test points would also land on different axes from the ones the classifier was trained on, so the score would be meaningless."}]}, {"id": "kernel_pca", "title": "Kernel PCA", "part": "Dimensionality Reduction", "partNo": "Part 9", "section": "Section 45 - Kernel PCA", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%209%20-%20Dimensionality%20Reduction/Section%2045%20-%20Kernel%20PCA/Python/kernel_pca.ipynb", "summary": "Kernel PCA is a version of PCA that uses the kernel trick to bend the data first, so it can squeeze many columns into a few while following curved patterns.", "whenToUse": "Use Kernel PCA when you suspect the groups in your data are separated by curves rather than straight lines; the limitation is that it gets slow and memory-hungry on large datasets and its new columns are very hard to interpret.", "readFirst": "**principal_component_analysis** (Kernel PCA is the curved version of it) and **kernel_svm** (the same kernel trick and RBF kernel appear there).", "terms": ["kernel trick", "rbf kernel", "non-linear", "gamma"], "mistakes": ["**Skipping feature scaling.** The RBF kernel measures how close two wines are, and without scaling those distances are dominated by big-number columns like Proline. Keep `StandardScaler` before `KernelPCA`.", "**Expecting the components to have a meaning.** After the kernel bending, PC1 and PC2 are even harder to interpret than plain PCA components. Don't try to read them as \"alcohol\" or \"colour\".", "**Using it on very large datasets without thinking.** Kernel PCA compares every training row with every other row, so the work grows very fast with the number of rows. 142 wines is fine; hundreds of thousands of rows can run out of memory.", "**Thinking the kernel choice doesn't matter.** `kernel = 'rbf'` with default settings works well here, but on other data a different kernel or `gamma` can change the result a lot. Try a few and compare on the test set."], "tryThis": ["In the \"Applying Kernel PCA\" cell, change `kernel = 'rbf'` to `kernel = 'linear'` and re-run everything below. What to notice: a linear kernel does no bending, so this is essentially ordinary PCA. Compare the accuracy and chart with the PCA notebook.", "Try other kernels in the same cell: `kernel = 'poly'`, then `kernel = 'sigmoid'`. Re-run down through the charts each time. What to notice: how the shape of the clumps in the training chart changes, and whether the accuracy stays at 1.0.", "Add a `gamma` setting, which controls how far the RBF kernel's idea of \"similar\" reaches: `KernelPCA(n_components = 2, kernel = 'rbf', gamma = 1)`, then try `gamma = 0.01`. Re-run everything below. What to notice: with a large gamma only very close wines count as similar, so the clumps may squash together or scatter; watch the confusion matrix.", "In the splitting cell, change `random_state = 0` to `random_state = 1` and re-run from there. What to notice: whether the perfect score holds on a different shuffle of only 36 test wines."], "quiz": [{"q": "Why would you use Kernel PCA instead of plain PCA?", "a": "Plain PCA can only find straight directions. If the groups sit in curved shapes, like one ring around another, no straight view separates them. Kernel PCA uses the kernel trick to bend the data so curved patterns become straight, then does PCA."}, {"q": "Does Kernel PCA use the customer segments when it learns? How can you tell from the code?", "a": "No. `kpca.fit_transform(X_train)` is given only `X_train`, with no `y_train`. Like plain PCA it is unsupervised, unlike LDA."}, {"q": "Logistic regression only draws straight boundaries. Why can it still work well after Kernel PCA?", "a": "The kernel has already done the bending. In the new PC1/PC2 space the groups can be split by straight lines even if they were curved in the original 13 measurements."}, {"q": "What would happen if you changed `kernel = 'rbf'` to `kernel = 'linear'`?", "a": "You would get what is essentially ordinary PCA, because a linear kernel does no bending. On this wine data you would expect results like the PCA notebook's, where one test wine was misclassified, rather than a perfect score."}]}, {"id": "k_fold_cross_validation", "title": "k-Fold Cross Validation", "part": "Model Selection _ Boosting", "partNo": "Part 10", "section": "Section 48 - Model Selection", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%2010%20-%20Model%20Selection%20_%20Boosting/Section%2048%20-%20Model%20Selection/Python/k_fold_cross_validation.ipynb", "summary": "k-fold cross validation splits the training data into k groups, trains and tests the model k times with a different group held out each time, and reports the average score and how much it varies.", "whenToUse": "Use it whenever you want a trustworthy estimate of how good a model is or want to compare models fairly, especially with small datasets; the limitation is that it multiplies training time by k, which hurts with big data or slow models.", "readFirst": "**kernel_svm**, because this notebook reuses exactly the same Kernel SVM on the same ad data; the only new part is how the model is judged.", "terms": ["k-fold cross validation", "fold", "cross_val_score", "mean accuracy", "standard deviation"], "mistakes": ["**Using the test set to make choices, then calling it a fair final exam.** If you tweak the model based on the test score, the test set stops being unseen. Keep it untouched, as this notebook does by passing only `X_train, y_train` to `cross_val_score`.", "**Only looking at the average and ignoring the standard deviation.** An average of 90% with a spread of 20% means the model is unreliable. Always read the two numbers together: high average *and* small spread.", "**Thinking `cross_val_score` trains `classifier` for you.** It trains 10 temporary copies and throws them away; the `classifier` you use for `predict` is still the one from `classifier.fit(...)`. Cross validation *measures* a model, it doesn't *improve* it.", "**Scaling all the data before splitting it.** If `StandardScaler` learns the average and spread from every row (including test rows), information leaks from the exam into the study notes. Fit the scaler on the training set only, as done here with `fit_transform` on `X_train` and `transform` on `X_test`."], "tryThis": ["In the k-Fold cell, change `cv = 10` to `cv = 5`, then to `cv = 20`, and rerun. What to notice: the average accuracy moves only a little, but the standard deviation changes, because each exam group gets bigger (fewer folds) or smaller (more folds), and small exams give jumpier scores.", "Add a new line `print(accuracies)` at the end of the k-Fold cell. What to notice: you see all 10 individual scores; check which folds pulled the average down and how far the lowest and highest are from 90.33%.", "In the training cell, replace `SVC(kernel = 'rbf', random_state = 0)` with `SVC(kernel = 'linear', random_state = 0)` and rerun everything below it. What to notice: compare the new cross-validation average and spread with 90.33% and 6.57%; a straight boundary is expected to do a bit worse on this data, and the charts now show a straight dividing line.", "In the split cell, change `random_state = 0` to `random_state = 1` and rerun all later cells. What to notice: the single test accuracy (0.93 before) can jump noticeably, while the cross-validation average tends to stay closer to where it was. That is exactly why k-fold is the more trustworthy number."], "quiz": [{"q": "Why is one test-set accuracy (0.93) not enough to judge the model?", "a": "It comes from just one random split of the data, like one exam with one set of questions. A different split could make the model look luckier or unluckier. Averaging over 10 different mini exams gives a fairer picture."}, {"q": "With `cv = 10` on 300 training people, how many people are in each exam group, and how many times is the model trained?", "a": "Each group has 30 people. The model is trained 10 times, each time studying on 270 people and being tested on the 30 left out, so every group gets one turn as the exam."}, {"q": "The output says Accuracy 90.33 % and Standard Deviation 6.57 %. What does that tell you?", "a": "On average the model gets about 90% right, and most fold scores fall roughly between 84% and 97%. The single test score of 93% sits inside that range, so it wasn't a fluke."}, {"q": "What would happen if you set `cv = 300` (one person per exam)?", "a": "The model would be trained 300 times, which is much slower. Each exam would have just one person, so each score is either 0% or 100%; the average is still meaningful, but the standard deviation becomes very large and no longer tells you much."}]}, {"id": "grid_search", "title": "Grid Search", "part": "Model Selection _ Boosting", "partNo": "Part 10", "section": "Section 48 - Model Selection", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%2010%20-%20Model%20Selection%20_%20Boosting/Section%2048%20-%20Model%20Selection/Python/grid_search.ipynb", "summary": "Grid search tries every combination of the model settings you list, scores each with cross validation, and tells you which combination worked best.", "whenToUse": "Use it to tune a model's settings when you have a handful of candidate values to compare; its limitation is that the number of runs explodes as you add settings and values, so big grids get very slow (random search is a cheaper alternative).", "readFirst": "**k_fold_cross_validation** (grid search scores every setting with those 10 mini exams) and **kernel_svm** (the model whose C, gamma and kernel are being tuned).", "terms": ["hyperparameter", "grid search", "GridSearchCV", "C (regularization)", "gamma", "best_estimator_"], "mistakes": ["**Thinking `classifier` is now the tuned model.** `GridSearchCV` doesn't change `classifier`; it keeps its winner in `grid_search.best_estimator_`. In this notebook the charts still use the default `classifier`, so to see the tuned model you must use `grid_search.best_estimator_`.", "**Making the grid huge.** Every extra value multiplies the work: here 40 combinations × 10 folds = 400 training runs. Adding a few more values to each list can turn seconds into hours, so start coarse (e.g. 0.1, 1, 10) and then zoom in around the best value.", "**Putting `gamma` in the same grid as the linear kernel.** Gamma means nothing for a straight line, so mixing them wastes runs. That's why this notebook uses **two separate dictionaries** in `parameters`, one for `'linear'` and one for `'rbf'`.", "**Reporting `best_score_` as the final accuracy.** It is the best of 40 tries on the training data, so it is slightly optimistic, like quoting your best of 40 practice tests. Check the winning model once on the untouched test set for an honest final number."], "tryThis": ["After the grid search cell, add a new cell: `y_pred_best = grid_search.best_estimator_.predict(X_test)` then `print(confusion_matrix(y_test, y_pred_best))` and `print(accuracy_score(y_test, y_pred_best))`. What to notice: compare with the default model's `[[64 4] [3 29]]` and 0.93 to see whether tuning actually helped on unseen data.", "In both chart cells, replace `classifier.predict(` with `grid_search.best_estimator_.predict(` (and you may update the title). What to notice: the decision boundary of the tuned model (C = 0.5, gamma = 0.6) looks a bit different from the default one; see whether it is smoother or bendier.", "In the `parameters` list, change the RBF gamma list to `[1, 5, 10, 50]` and rerun the grid search. What to notice: very large gamma gives each point only a tiny reach, so the boundary gets wiggly and tends to memorise the training data; check whether the best score and best parameters change.", "Add a new cell after the grid search: `results = pd.DataFrame(grid_search.cv_results_)` then `print(results[['params', 'mean_test_score']].sort_values('mean_test_score', ascending = False).head(10))`. What to notice: many combinations score almost the same as the winner, which is why the gain over the default (90.33% → 90.67%) is so small."], "quiz": [{"q": "What is a hyperparameter, and why can't the model learn it by itself during `fit`?", "a": "A hyperparameter is a setting you choose before training, like C, gamma or the kernel, a bit like the knobs on an oven. `fit` only learns the boundary for fixed settings; it doesn't try different knob positions. Grid search does that trying for you."}, {"q": "Why are there 40 combinations and 400 training runs?", "a": "The linear grid has 4 values of C (4 combinations). The RBF grid has 4 values of C × 9 values of gamma (36 combinations). That's 40, and each is scored with 10-fold cross validation, so 40 × 10 = 400 runs."}, {"q": "The output says Best Accuracy 90.67 % with `{'C': 0.5, 'gamma': 0.6, 'kernel': 'rbf'}`. What does this tell you compared with the default model?", "a": "A curvy RBF boundary with a slightly more relaxed C beat the other combinations. But it only improves on the default's 90.33% by about a third of a point, so the defaults were already nearly as good."}, {"q": "What would happen if you removed `n_jobs = -1`?", "a": "The search would give the same results but run on a single processor core, so the 400 training runs would take longer. `n_jobs = -1` only changes speed, not the answer."}]}, {"id": "xg_boost", "title": "XGBoost", "part": "Model Selection _ Boosting", "partNo": "Part 10", "section": "Section 49 - XGBoost", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%2010%20-%20Model%20Selection%20_%20Boosting/Section%2049%20-%20XGBoost/Python/xg_boost.ipynb", "summary": "XGBoost builds many small decision trees one after another, each fixing the mistakes of the ones before, and adds them up into one strong classifier.", "whenToUse": "Reach for it on table-shaped data (rows and columns, like a spreadsheet) when you want top accuracy with little preparation; the limitation is that it has many settings to tune and its many-tree decisions are harder to explain than a single tree.", "readFirst": "**decision_tree_classification** and **random_forest_classification** (XGBoost is also built from many trees), plus **k_fold_cross_validation** (used at the end to check the model).", "terms": ["gradient boosting", "XGBoost", "weak learner", "LabelEncoder", "false negative"], "mistakes": ["**Feeding XGBoost labels like 2 and 4.** Recent XGBoost versions expect classes numbered 0, 1, 2, … and stop with an error otherwise. This notebook fixes it with `LabelEncoder` (2 → 0 benign, 4 → 1 malignant); remember the confusion matrix rows and columns are now in that 0, 1 order.", "**Leaving an ID column in the inputs.** *Sample code number* is just a label, but a model can still latch onto it by accident and learn nonsense. That's why `iloc[:, 1:-1]` skips the first column; always drop IDs, row numbers and similar columns.", "**Judging the model only by accuracy on a medical problem.** Missing a cancer (malignant called benign, the bottom-left of the confusion matrix) is far worse than a false alarm. Read the confusion matrix, not just the single accuracy number.", "**Cranking up the number of trees and their depth to chase a perfect score.** Boosting keeps fixing mistakes, so with too many or too deep trees it starts memorising noise in the training data (overfitting). Watch the cross-validation score, not the training score, when changing settings."], "tryThis": ["In the training cell, change `XGBClassifier()` to `XGBClassifier(n_estimators = 5)` and rerun the cells below. What to notice: with only 5 trees there are fewer rounds of fixing mistakes; compare the confusion matrix, accuracy and cross-validation numbers with the default (100 trees).", "In the training cell, try `XGBClassifier(max_depth = 1)` (each tree asks just one yes/no question) and then `XGBClassifier(max_depth = 10)`. What to notice: even single-question trees can do well once many are added together, which is the whole idea of boosting weak guessers.", "Add a new cell after training: `print(dict(zip(dataset.columns[1:-1], classifier.feature_importances_.round(3))))`. What to notice: which of the 9 cell scores the trees rely on most; often a few features carry most of the weight.", "Add a new cell to compare with an earlier model: `from sklearn.ensemble import RandomForestClassifier` then `rf = RandomForestClassifier(n_estimators = 100, random_state = 0)` and `print(cross_val_score(rf, X_train, y_train, cv = 10).mean())` (run it after the k-Fold cell so `cross_val_score` is imported). What to notice: how close the random forest's average accuracy is to XGBoost's on this fairly easy dataset."], "quiz": [{"q": "How is XGBoost different from a random forest, if both use many trees?", "a": "A random forest builds its trees independently and lets them vote. XGBoost builds trees one after another, and each new tree focuses on fixing the mistakes the earlier trees still make. That step-by-step fixing is called gradient boosting."}, {"q": "Why is there no feature scaling in this notebook?", "a": "Trees only ask yes/no questions such as \"is Clump Thickness above 5?\". Whether the numbers are big or small doesn't change the answer to those questions, so scaling isn't needed."}, {"q": "When you run the confusion matrix cell, which cell of the 2×2 table holds the most dangerous mistakes, and why?", "a": "The bottom-left cell. Rows are the real class and columns the guess, in the order 0 (benign), 1 (malignant), so bottom-left means the tumour was really malignant but the model said benign: a missed cancer. A false alarm (top-right) leads to extra tests; a miss could mean no treatment."}, {"q": "What would happen if you removed the `LabelEncoder` line and kept y as 2 and 4?", "a": "Recent versions of XGBoost would stop with an error at `classifier.fit`, complaining that the class labels are not 0 and 1. The encoder simply renames 2 → 0 and 4 → 1 so XGBoost accepts them."}]}];
const KEY = 'ml-study-v1';
let state = { current: DATA[0] && DATA[0].id, done: {}, quiz: {}, tried: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
function md(s) {
  const parts = String(s).split(/(`[^`]+`)/g);
  return parts.map(p => p.startsWith('`') && p.endsWith('`') && p.length > 1
    ? '<code>' + esc(p.slice(1, -1)) + '</code>'
    : esc(p).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
            .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
            .replace(/\n/g, '<br>')).join('');
}

function renderNav() {
  const q = document.getElementById('search').value.toLowerCase();
  let html = '', part = '';
  DATA.forEach(d => {
    const hay = (d.title + ' ' + d.summary + ' ' + d.terms.join(' ')).toLowerCase();
    if (q && !hay.includes(q)) return;
    if (d.part !== part) { part = d.part; html += `<h2>${esc(d.partNo)} · ${esc(part)}</h2>`; }
    html += `<button data-id="${d.id}" class="${d.id === state.current ? 'active' : ''} ${state.done[d.id] ? 'done' : ''}">
      <span class="tick">${state.done[d.id] ? '✓' : ''}</span>${esc(d.title)}</button>`;
  });
  document.getElementById('list').innerHTML = html || '<p style="color:var(--muted);padding:0 8px">No matches.</p>';
  document.getElementById('pick').innerHTML = DATA.map(d =>
    `<option value="${d.id}" ${d.id === state.current ? 'selected' : ''}>${state.done[d.id] ? '✓ ' : ''}${esc(d.partNo)} · ${esc(d.title)}</option>`).join('');
  const n = DATA.filter(d => state.done[d.id]).length;
  document.getElementById('bar').style.width = (100 * n / DATA.length) + '%';
  document.getElementById('count').textContent = `${n} of ${DATA.length} topics done`;
}

function renderMain() {
  const i = DATA.findIndex(d => d.id === state.current), d = DATA[i];
  if (!d) return;
  const prev = DATA[i - 1], next = DATA[i + 1];
  const quiz = d.quiz.map((q, k) => {
    const key = d.id + ':' + k, v = state.quiz[key];
    return `<div class="q ${v === 'right' ? 'right open' : v === 'again' ? 'again open' : ''}" data-k="${key}">
      <p class="qtext">${k + 1}. ${md(q.q)}</p>
      <button class="btn ghost reveal">${v ? 'Hide answer' : 'Show answer'}</button>
      <div class="answer">${md(q.a)}
        <div class="row"><span style="color:var(--muted);font-size:14px;align-self:center">Did you get it?</span>
          <button data-v="right" class="${v === 'right' ? 'sel-right' : ''}">Yes 👍</button>
          <button data-v="again" class="${v === 'again' ? 'sel-again' : ''}">Review again</button></div>
      </div></div>`;
  }).join('');
  const tries = d.tryThis.map((t, k) => {
    const key = d.id + ':' + k, on = !!state.tried[key];
    return `<li class="${on ? 'checked' : ''}"><input type="checkbox" data-t="${key}" ${on ? 'checked' : ''} aria-label="Mark experiment ${k + 1} done"><div>${md(t)}</div></li>`;
  }).join('');
  document.getElementById('main').innerHTML = `
    <div class="crumb">${esc(d.partNo)} · ${esc(d.part)} › ${esc(d.section)}</div>
    <h2 class="title">${esc(d.title)}</h2>
    <p class="lead">${md(d.summary)}</p>
    <div class="cards">
      <div class="card"><h3>When to use it</h3><p>${md(d.whenToUse)}</p></div>
      <div class="card"><h3>Read first</h3><p>${md(d.readFirst)}</p></div>
      <div class="card" style="grid-column:1/-1"><h3>New words</h3><div class="chips">${d.terms.map(t => `<span class="chip">${esc(t)}</span>`).join('')}</div></div>
    </div>
    <div class="actions">
      <a class="btn" href="${d.url}" target="_blank" rel="noopener">Open the notebook ↗</a>
      <button class="btn ${state.done[d.id] ? 'good' : 'ghost'}" id="done">${state.done[d.id] ? '✓ Done' : 'Mark as done'}</button>
    </div>
    <section class="block"><h3>Check your understanding</h3><p class="hint">Answer in your head first, then reveal and mark yourself honestly.</p>${quiz}</section>
    <section class="block"><h3>Try this yourself</h3><p class="hint">Change one thing in the notebook, rerun it, and tick it off.</p><ol class="try">${tries}</ol></section>
    <section class="block"><h3>Common mistakes to avoid</h3><ul class="mistakes">${d.mistakes.map(m => `<li>${md(m)}</li>`).join('')}</ul></section>
    <div class="pager">
      ${prev ? `<button data-go="${prev.id}">← ${esc(prev.title)}</button>` : '<span></span>'}
      ${next ? `<button data-go="${next.id}">${esc(next.title)} →</button>` : '<span></span>'}
    </div>`;
}

function go(id) { state.current = id; save(); renderNav(); renderMain(); window.scrollTo(0, 0); }
function render() { renderNav(); renderMain(); }

document.getElementById('list').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) go(b.dataset.id); });
document.getElementById('pick').addEventListener('change', e => go(e.target.value));
document.getElementById('search').addEventListener('input', renderNav);
document.getElementById('main').addEventListener('click', e => {
  const t = e.target;
  if (t.id === 'done') { state.done[state.current] = !state.done[state.current]; save(); render(); return; }
  if (t.dataset.go) { go(t.dataset.go); return; }
  const q = t.closest('.q');
  if (q && t.classList.contains('reveal')) {
    q.classList.toggle('open'); t.textContent = q.classList.contains('open') ? 'Hide answer' : 'Show answer'; return;
  }
  if (q && t.dataset.v) { state.quiz[q.dataset.k] = state.quiz[q.dataset.k] === t.dataset.v ? undefined : t.dataset.v; save(); renderMain(); }
});
document.getElementById('main').addEventListener('change', e => {
  if (e.target.dataset.t) { state.tried[e.target.dataset.t] = e.target.checked; save(); e.target.closest('li').classList.toggle('checked', e.target.checked); }
});
document.getElementById('theme').addEventListener('click', () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem(KEY + '-theme', root.dataset.theme); } catch (e) {}
});
try { const th = localStorage.getItem(KEY + '-theme'); if (th) document.documentElement.dataset.theme = th; } catch (e) {}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  const i = DATA.findIndex(d => d.id === state.current);
  if (e.key === 'ArrowRight' && DATA[i + 1]) go(DATA[i + 1].id);
  if (e.key === 'ArrowLeft' && DATA[i - 1]) go(DATA[i - 1].id);
});
if (!DATA.some(d => d.id === state.current)) state.current = DATA[0] && DATA[0].id;
render();
</script>
</body>
</html>
