<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ML Study Guide</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2128; --muted: #5d6573; --line: #e2e5ea;
  --accent: #2e6fba; --accent-soft: #e6effa; --good: #2f8a50; --good-soft: #e5f4ea;
  --warn: #b5602a; --warn-soft: #fbeee4; --code: #f0f2f5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171c; --panel: #1c2027; --ink: #e8eaee; --muted: #9aa3b2; --line: #2c323c;
    --accent: #6ea8ec; --accent-soft: #1f2d40; --good: #5cc283; --good-soft: #1b3226;
    --warn: #eb9a62; --warn-soft: #3a281c; --code: #262b34;
  }
}
:root[data-theme="dark"] {
  --bg: #14171c; --panel: #1c2027; --ink: #e8eaee; --muted: #9aa3b2; --line: #2c323c;
  --accent: #6ea8ec; --accent-soft: #1f2d40; --good: #5cc283; --good-soft: #1b3226;
  --warn: #eb9a62; --warn-soft: #3a281c; --code: #262b34;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; font-size: .9em;
  font-family: ui-monospace, Consolas, "Cascadia Code", monospace; overflow-wrap: anywhere; }
a { color: var(--accent); }
button { font: inherit; cursor: pointer; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; white-space: nowrap; }
.progress { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--good); width: 0; transition: width .3s; }
.theme { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 4px 10px; }
.layout { display: grid; grid-template-columns: 300px 1fr; max-width: 1200px; margin: 0 auto; }
nav { border-right: 1px solid var(--line); padding: 16px 12px; height: calc(100vh - 57px); overflow-y: auto;
  position: sticky; top: 57px; }
nav input { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--panel); color: var(--ink); margin-bottom: 12px; }
nav h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 14px 8px 4px; }
nav button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0;
  background: transparent; color: var(--ink); padding: 6px 8px; border-radius: 6px; font-size: 14px; }
nav button:hover { background: var(--accent-soft); }
nav button.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
nav .tick { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line); flex: none;
  display: grid; place-items: center; font-size: 11px; color: #fff; }
nav .done .tick { background: var(--good); border-color: var(--good); }
.mobile-pick { display: none; }
main { padding: 24px 32px 80px; min-width: 0; }
.crumb { color: var(--muted); font-size: 14px; }
main h2.title { font-size: 30px; margin: 4px 0 12px; line-height: 1.2; }
.lead { font-size: 18px; margin: 0 0 18px; }
.cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 22px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
.card h3 { margin: 0 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.card p { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--accent-soft); color: var(--accent); border-radius: 99px; padding: 2px 10px; font-size: 13px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 4px 0 26px; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px;
  padding: 8px 14px; text-decoration: none; font-weight: 600; font-size: 15px; }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.good { background: var(--good); border-color: var(--good); }
section.block { margin-bottom: 30px; }
section.block > h3 { font-size: 20px; margin: 0 0 4px; }
section.block > .hint { color: var(--muted); margin: 0 0 12px; font-size: 14px; }
.q { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
.q.right { border-color: var(--good); }
.q.again { border-color: var(--warn); }
.q .qtext { font-weight: 600; margin: 0 0 10px; }
.q .answer { display: none; border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 4px; }
.q.open .answer { display: block; }
.q .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.q .row button { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 8px; padding: 4px 10px; font-size: 14px; }
.q .row button.sel-right { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.q .row button.sel-again { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
ol.try { padding: 0; margin: 0; list-style: none; counter-reset: t; }
ol.try li { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px 12px 14px;
  margin-bottom: 10px; display: flex; gap: 12px; align-items: flex-start; }
ol.try input { margin-top: 5px; width: 18px; height: 18px; accent-color: var(--good); flex: none; }
ol.try li.checked { opacity: .65; }
ul.mistakes { padding: 0; margin: 0; list-style: none; }
ul.mistakes li { border-left: 4px solid var(--warn); background: var(--warn-soft); border-radius: 0 10px 10px 0;
  padding: 10px 14px; margin-bottom: 10px; }
.pager { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.pager button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px; padding: 8px 14px; max-width: 48%; }
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; }
  nav { display: none; }
  .mobile-pick { display: block; padding: 12px 16px 0; }
  .mobile-pick select { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; }
  main { padding: 16px 16px 60px; }
  main h2.title { font-size: 24px; }
  .cards { grid-template-columns: 1fr; }
  header { padding: 10px 16px; }
}
</style>
</head>
<body>
<header>
  <h1>🧭 ML Study Guide</h1>
  <div class="progress"><div class="bar"><i id="bar"></i></div><span id="count"></span></div>
  <button class="theme" id="theme" title="Switch light / dark">◐</button>
</header>
<div class="mobile-pick"><select id="pick" aria-label="Choose a notebook"></select></div>
<div class="layout">
  <nav><input id="search" type="search" placeholder="Search topics…" aria-label="Search topics"><div id="list"></div></nav>
  <main id="main"></main>
</div>
<script>
const DATA = [{"id": "data_preprocessing_tools", "title": "Data Preprocessing Tools", "part": "Data Preprocessing", "partNo": "Part 1", "section": "Section 2 -------------------- Part 1 - Data Preprocessing --------------------", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%201%20-%20Data%20Preprocessing/Section%202%20--------------------%20Part%201%20-%20Data%20Preprocessing%20--------------------/Python/data_preprocessing_tools.ipynb", "summary": "Data preprocessing turns a raw table into clean, all-number data a model can learn from: it fills gaps, converts words to numbers, sets aside test data and puts the numbers on a similar scale.", "whenToUse": "You do some version of these steps at the start of almost every machine-learning project, but filling gaps with an average is only a guess, so if many values are missing it can hide real patterns or bias the data.", "readFirst": "Nothing — this is the starting point.", "terms": ["missing values", "imputation", "one-hot encoding", "label encoding", "train/test split", "feature scaling"], "mistakes": ["**Scaling before splitting, or calling `fit_transform` on the test set.** That lets the test rows influence the average and spread, so the test is no longer truly \"unseen\" (this is called *data leakage*). Split first, `fit_transform` on `X_train`, and only `transform` on `X_test`.", "**Scaling the one-hot country columns too.** If you scale all of `X_train` instead of `X_train[:, 3:]`, the clean 0/1 country flags turn into odd decimals and lose their simple meaning. Only scale the real number columns (Age and Salary).", "**Re-running a cell that changes `X` in place.** Running the one-hot encoding cell a second time encodes column 0 again, but column 0 is now the France flag, not Country, so X quietly becomes nonsense. Running the scaling cell twice scales already-scaled numbers. If in doubt, use *Restart & Run All*.", "**Getting the column slice wrong.** In Python, `X[:, 1:3]` means columns 1 and 2 — the end number is *not* included. Writing `X[:, 1:2]` would fill only Age and leave Salary's gap as `nan`."], "tryThis": ["In the missing-data cell, change `strategy='mean'` to `strategy='median'` and re-run from the top. What to notice: the gaps are now filled with the middle value instead of the average — the missing age becomes **38.0** and the missing salary **61000.0**. The median is less pulled around by unusually high or low values.", "After the `LabelEncoder` cell, add a new cell with `print(le.classes_)`. What to notice: it prints `['No' 'Yes']`, the labels in alphabetical order — position 0 is No and position 1 is Yes, which is exactly why No became 0 and Yes became 1.", "In the split cell, change `random_state = 1` to `random_state = 0` and re-run from the top. What to notice: different customers end up in `X_test`, and the scaled Age and Salary numbers change too, because the average and spread are now worked out from a different set of 8 training customers.", "After the feature-scaling cell, add `print(sc.mean_)` and `print(sc.scale_)`. What to notice: these are the training-set average and spread for Age and Salary that were used to scale *both* the training and the test rows. Salary's spread is in the thousands while Age's is only a few years — that size gap is exactly what scaling removes."], "quiz": [{"q": "Why not just replace France, Germany and Spain with 0, 1 and 2?", "a": "Numbers imply an order and size, so the model would think Spain is \"bigger\" than France, or that Germany sits halfway between them. One-hot encoding gives each country its own yes/no column, so no fake order is created."}, {"q": "In the second `print(X)`, the missing salary became 63777.78. Where does that number come from?", "a": "It is the average of the 9 salaries that were known. `SimpleImputer` with `strategy='mean'` worked out each column's average in `fit` and wrote it into the gap in `transform`."}, {"q": "Why does the test set use `sc.transform` but the training set uses `sc.fit_transform`?", "a": "`fit` learns the average and spread, and that must come from the training data only. The test set is then scaled with those same numbers, so it is treated exactly like brand-new data the model would meet later."}, {"q": "What would happen if you changed the imputer to work on `X[:, 0:3]` instead of `X[:, 1:3]`?", "a": "It would fail with an error, because column 0 holds country names and you can't take the average of words. That is why the code starts at column 1."}]}, {"id": "data_preprocessing_template", "title": "Data Preprocessing Template", "part": "Data Preprocessing", "partNo": "Part 1", "section": "Section 2 -------------------- Part 1 - Data Preprocessing --------------------", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%201%20-%20Data%20Preprocessing/Section%202%20--------------------%20Part%201%20-%20Data%20Preprocessing%20--------------------/Python/data_preprocessing_template.ipynb", "summary": "The template is a reusable skeleton that loads the libraries and a CSV, separates the inputs from the answer column, and splits the rows into training and test sets.", "whenToUse": "Copy it as the opening of any new project to save typing, but remember it does no cleaning, so on messy real data you must add the missing-value, encoding and scaling steps yourself.", "readFirst": "**Data Preprocessing Tools** — this template is a cut-down version of it, so it helps to know what the removed steps (filling gaps, encoding, scaling) do.", "terms": ["starter template", "iloc", "train_test_split", "random_state"], "mistakes": ["**Thinking the data is ready for a model after this template.** Here X still contains country names and two `nan` gaps, so most models would crash. Add the cleaning steps from the Tools notebook whenever your data needs them.", "**Using a CSV where the answer isn't the last column.** `iloc[:, :-1]` and `iloc[:, -1]` assume the target is last. If it isn't, X will contain the answer and y will be the wrong column — move the column or change the slices.", "**The CSV not being found.** `pd.read_csv('Data.csv')` looks in the folder the notebook is running from. If you copy the template elsewhere, also copy the CSV or give its full path, or you'll get a `FileNotFoundError`.", "**Changing `random_state` between runs and comparing results.** Each `random_state` gives a different shuffle, so results from different seeds aren't a like-for-like comparison. Keep it fixed while you experiment with other settings."], "tryThis": ["After the split cell, add a new cell with `print(X_train)` and `print(X_test)`. What to notice: you get 8 and 2 rows, and the data is still raw — country names are words and the missing values still show as `nan`.", "In the dataset cell, add a line `print(dataset.isnull().sum())`. What to notice: it counts the empty cells per column — one in Age and one in Salary — a quick check for whether you need the \"missing data\" step from the Tools notebook.", "In the split cell, change `test_size = 0.2` to `test_size = 0.3` and add `print(len(X_train), len(X_test))`. What to notice: with 10 rows you now get 7 training and 3 test rows. With such a tiny dataset, every row you hold back is one fewer to learn from.", "In the split cell, change `random_state = 0` to `random_state = 1` and print `X_test`. What to notice: you get the same two test customers as in the Tools notebook (the German customer aged 30 and the French customer aged 37), because the shuffle depends only on the seed and the number of rows."], "quiz": [{"q": "What does `dataset.iloc[:, :-1]` select?", "a": "All rows (`:`) and every column except the last one (`:-1`). Here that's Country, Age and Salary — the inputs."}, {"q": "Why does the template expect the answer column to be last in the CSV?", "a": "Because then the same two lines (`:-1` for X and `-1` for y) work for any dataset without editing. It's a convention that makes the template reusable."}, {"q": "With `test_size = 0.2` and 10 rows, how many customers are in each set, and why hold any back?", "a": "8 go to training and 2 to testing. The 2 held-back rows act like an exam with new questions, showing whether a model learned the pattern instead of memorising the answers."}, {"q": "What would happen if you tried to train a model straight away on this template's `X_train`?", "a": "Most scikit-learn models would raise an error, because X still contains text (country names) and missing values (`nan`). You'd need the cleaning steps from the Tools notebook first."}]}, {"id": "simple_linear_regression", "title": "Simple Linear Regression", "part": "Regression", "partNo": "Part 2", "section": "Section 4 - Simple Linear Regression", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%202%20-%20Regression/Section%204%20-%20Simple%20Linear%20Regression/Python/simple_linear_regression.ipynb", "summary": "Simple linear regression draws the best straight line through data points so you can predict one number (salary) from one other number (years of experience).", "whenToUse": "Reach for it when you expect one measurement to rise or fall steadily with another, such as cost with size, but it can only draw straight lines, so it fits curved relationships poorly.", "readFirst": "**Data Preprocessing Template** (and Tools) — this notebook starts with the same load-and-split steps, so you should know what X, y and the training/test split are.", "terms": ["linear regression", "intercept", "slope (coefficient)", "least squares", "regressor"], "mistakes": ["**Giving the model a flat list instead of a table.** scikit-learn wants inputs shaped like a table (rows × columns). `dataset.iloc[:, 0].values` gives a flat list and `fit` raises an error; `iloc[:, :-1]` keeps it as one column. The same applies to predicting one value: write `regressor.predict([[5]])`, not `regressor.predict(5)`.", "**Trusting the line far outside the data.** The employees here have roughly 1 to 10.5 years of experience. Asking about 40 years will still give an answer, but the straight line just keeps rising forever, so that guess is not reliable.", "**Judging the model only on the training chart.** The line was built to fit the red training dots, so of course it looks good there. The test-set chart is the honest check.", "**Reading the line as cause and effect.** The model shows that salary and experience rise together in this data; it doesn't prove that each extra year *causes* exactly that raise for every person."], "tryThis": ["After the training cell, add a cell with `print(regressor.intercept_, regressor.coef_)`. What to notice: these are the two numbers the model learned — the starting salary at 0 years and the raise per extra year. Check them against the chart: the blue line should start near the intercept on the left and climb by about the coefficient for each year.", "Add a cell with `print(regressor.predict([[12]]))` (note the double brackets). What to notice: you get a salary for 12 years of experience, even though nobody in the data has more than 10.5 years — the model happily extends the straight line beyond the data.", "After the prediction cell, add `print(np.concatenate((y_pred.reshape(len(y_pred),1), y_test.reshape(len(y_test),1)),1))`. What to notice: a two-column table of predicted vs real salary for the 10 test employees — the same check the Multiple Linear Regression notebook uses instead of charts.", "Add a cell with `print(regressor.score(X_test, y_test))`. What to notice: this is the **R²** score — 1.0 would be a perfect fit and 0 would be no better than always guessing the average salary. A value close to 1 matches what the test chart shows."], "quiz": [{"q": "In the test-set chart, why is the blue line drawn with `X_train` and `regressor.predict(X_train)` rather than the test data?", "a": "The model is one fixed line. Drawing it from the training points gives exactly the same line you'd get from any other points, so only the red dots change — we're comparing the same rule against new people."}, {"q": "What does the printed `LinearRegression(copy_X=True, fit_intercept=True, ...)` tell you?", "a": "Only the model's settings, confirming it was trained. It does not show the line; to see the learned numbers you print `regressor.intercept_` and `regressor.coef_`."}, {"q": "Why is no feature scaling needed here?", "a": "Linear regression simply chooses a multiplier that suits whatever scale the input is on. With a single input there's also no other column for it to be compared against."}, {"q": "What would happen if you changed `test_size = 1/3` to `test_size = 0.9`?", "a": "Only 3 employees would be left to learn from and 27 would be test points. The line would depend heavily on those 3 points, so it could be noticeably tilted or shifted and fit the test dots worse."}]}, {"id": "multiple_linear_regression", "title": "Multiple Linear Regression", "part": "Regression", "partNo": "Part 2", "section": "Section 5 - Multiple Linear Regression", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%202%20-%20Regression/Section%205%20-%20Multiple%20Linear%20Regression/Python/multiple_linear_regression.ipynb", "summary": "Multiple linear regression predicts one number (profit) from several inputs at once by learning a separate multiplier for each input plus a base amount.", "whenToUse": "Use it when several factors together drive an outcome, such as spending categories driving profit, but it assumes each factor adds a straight-line effect, so it misses curves and interactions between inputs.", "readFirst": "**Simple Linear Regression** (the same model with one input) and **Data Preprocessing Tools** (for one-hot encoding, used here on State).", "terms": ["multiple linear regression", "coefficients", "dummy variables", "dummy variable trap", "backward elimination"], "mistakes": ["**Encoding State as 0, 1, 2.** Using `LabelEncoder` on an input column makes the model treat State as a quantity, as if Florida were \"twice\" California. Use one-hot encoding for categories that have no natural order.", "**Feeding new data in the wrong column order.** After encoding, the columns are California, Florida, New York, R&D, Administration, Marketing — the state flags come *first*. A new startup passed to `predict` must use exactly that order, or the predictions will be garbage without any error.", "**Comparing raw coefficient sizes to decide what matters most.** A multiplier's size depends on the units of its column, and inputs that move together can share or swap credit. Treat coefficients as a hint, not proof of importance.", "**Assuming every input helps.** This code keeps all inputs. Some may add little, and extra weak inputs can make a model worse on new data — that's what feature selection such as backward elimination is for."], "tryThis": ["After the training cell, add `print(regressor.coef_)` and `print(regressor.intercept_)`. What to notice: there are **six** multipliers, in the order California, Florida, New York, R&D, Administration, Marketing. Look at the signs and sizes of the three spending ones — each says how much predicted profit changes per extra dollar spent, with everything else held equal.", "Right after the encoding cell, add a cell with `X = X[:, 1:]` (dropping the California column) and re-run the cells below it. What to notice: the predicted-vs-real table is essentially unchanged. California just becomes the \"baseline\" state, which is why scikit-learn doesn't need you to avoid the dummy variable trap by hand.", "Restart and run from the top, but after the encoding cell add `X = X[:, [3]]` so only R&D Spend is used. What to notice: compare the new predicted-vs-real table with the original — this shows how much of the profit can be explained by R&D spending alone versus using every input.", "Add a cell with `print(regressor.predict([[1, 0, 0, 160000, 130000, 300000]]))`. What to notice: you've predicted profit for a made-up California startup spending 160k on R&D, 130k on admin and 300k on marketing. Change the `1, 0, 0` to `0, 0, 1` (New York) and see how much the state alone shifts the answer."], "quiz": [{"q": "In the final printout, which column is the prediction and which is the real profit? How far off is the first row?", "a": "The left column is the predicted profit and the right is the real profit. The first row predicts 103015.2 against a real 103282.38, so it's off by only about 267."}, {"q": "Why is there no chart like in simple linear regression?", "a": "With several inputs the model is no longer a line on a 2D chart but a flat surface in many dimensions, which can't be drawn. A predicted-vs-real table is used instead."}, {"q": "Why doesn't the code drop one of the three state columns to avoid the dummy variable trap?", "a": "The three columns always add up to 1, so one is redundant, but scikit-learn's `LinearRegression` copes with this automatically. Dropping one by hand gives essentially the same predictions."}, {"q": "What would happen if you skipped the encoding cell and went straight to training?", "a": "`fit` would raise an error, because the State column still contains words like 'New York' and the model can only do maths on numbers."}]}, {"id": "polynomial_regression", "title": "Polynomial Regression", "part": "Regression", "partNo": "Part 2", "section": "Section 6 - Polynomial Regression", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%202%20-%20Regression/Section%206%20-%20Polynomial%20Regression/Python/polynomial_regression.ipynb", "summary": "Polynomial regression fits a curved line by adding powers of the input (x², x³, ...) as extra columns and then running ordinary linear regression on them.", "whenToUse": "Reach for it when a single input has a smooth, bending relationship with the output (like salaries that rise faster at the top), but beware that high degrees overfit and predictions outside the training range can explode.", "readFirst": "**multiple_linear_regression** (and simple_linear_regression before it): polynomial regression is just a multiple linear regression whose extra columns are powers of one input.", "terms": ["polynomial features", "degree", "baseline model", "overfitting", "prediction grid (X_grid)"], "mistakes": ["**Passing the raw level to the polynomial model.** `lin_reg_2.predict([[6.5]])` fails, because `lin_reg_2` was trained on 5 columns (1, x, x², x³, x⁴) and you gave it 1. Always send new inputs through `poly_reg` first, as in `lin_reg_2.predict(poly_reg.fit_transform([[6.5]]))`.", "**Cranking the degree up \"for a better fit\".** A very high degree can pass through all 10 dots yet swing wildly between them. That is overfitting: the curve memorises the points instead of the trend. Pick the lowest degree that follows the shape, and check the smooth `X_grid` chart, not just the 10 dots.", "**Trusting the curve outside the data.** The model only saw levels 1 to 10. A degree-4 polynomial shoots off steeply past the last point, so a prediction for level 12 or 15 can be absurd. Only predict inside (or very near) the range you trained on.", "**Judging the curve from the 10-point plot.** The second chart joins only 10 predictions with straight segments, which hides wiggles between levels. Use the high-resolution chart (the one with `X_grid`) to see the real shape."], "tryThis": ["In the polynomial training cell, change `PolynomialFeatures(degree = 4)` to `degree = 2`, then rerun that cell, the two polynomial charts and the last prediction cell. Try `degree = 3` too. What to notice: degree 2 makes a gentler bend that misses some dots, and the 6.5 prediction moves away from the $158,862 shown now.", "Set `degree = 9` and rerun the training cell and the high-resolution chart (the one using `X_grid`). What to notice: with 10 points and degree 9 the curve can hit every dot, but look between the dots for bumps or dips. It looks \"perfect\" yet you would not trust it for in-between levels.", "In the last cell, change `[[6.5]]` to `[[11]]` (and in the linear prediction cell too). What to notice: both models happily return a number for a level that doesn't exist, and the polynomial one is far above the CEO's $1,000,000. Models extrapolate blindly.", "In the high-resolution chart cell, change the step in `np.arange(min(X), max(X), 0.1)` to `1`. What to notice: the curve goes back to looking like straight segments joined at the levels, which shows why the small step matters."], "quiz": [{"q": "Why is this still called *linear* regression when the line is curved?", "a": "Because the model still just multiplies each column by a number and adds them up. The curve comes from the extra columns (x², x³, x⁴) that `PolynomialFeatures` builds, not from a different kind of model."}, {"q": "The straight-line model predicts about $330,379 for level 6.5. Why is that clearly wrong?", "a": "Level 6.5 sits between Region Manager ($150,000) and Partner ($200,000), so a believable salary is between those. The straight line overshoots in the middle because it is tilted steeply to try to reach the CEO's huge salary."}, {"q": "Why does the notebook build a plain `LinearRegression` at all if it fits badly?", "a": "It is a baseline: a simple model to compare against. Seeing the straight line miss the dots, and give $330k instead of the polynomial's $159k, shows why the curve is needed."}, {"q": "What would happen if you called `lin_reg_2.predict([[6.5]])` without `poly_reg.fit_transform`?", "a": "You would get an error. `lin_reg_2` was trained on 5 columns (1, x, x², x³, x⁴), so it expects 5 numbers per row, but `[[6.5]]` has only one."}]}, {"id": "support_vector_regression", "title": "Support Vector Regression (SVR)", "part": "Regression", "partNo": "Part 2", "section": "Section 7 - Support Vector Regression (SVR)", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%202%20-%20Regression/Section%207%20-%20Support%20Vector%20Regression%20(SVR)/Python/support_vector_regression.ipynb", "summary": "Support Vector Regression fits a smooth curve with a tolerance tube around it, ignoring small errors inside the tube and only reacting to points that fall outside it.", "whenToUse": "Reach for it on small-to-medium datasets with a smooth, non-linear pattern where you don't want a few extreme points to drag the curve around, but remember it needs careful feature scaling and gets slow on very large datasets.", "readFirst": "**polynomial_regression** (same salary data and plots, so you can compare the curves) and **data_preprocessing_tools** for how `StandardScaler` feature scaling works.", "terms": ["epsilon tube", "kernel", "rbf kernel", "scaling y", "inverse_transform", "outlier"], "mistakes": ["**Forgetting to scale the question or unscale the answer.** The model only knows scaled numbers. `regressor.predict([[6.5]])` treats 6.5 as a huge scaled value, and its output is a small scaled number, not dollars. Always do all three steps: `sc_X.transform` the input, `predict`, then `sc_y.inverse_transform` the result.", "**Using `fit_transform` on new inputs.** `fit_transform` would recompute the average and spread from just that one value, giving a meaningless scaled number. On new data use `sc_X.transform(...)`, which reuses what the scaler learned from the training levels.", "**Skipping the scaling of y.** Unlike linear regression, SVR has no multipliers that adjust to big numbers, and its tube width (`epsilon=0.1`) is a fixed size. With salaries in the hundreds of thousands, a 0.1 tube is meaningless and the fit is poor. Scale y with its own scaler (`sc_y`).", "**Passing a flat list to `inverse_transform`.** `regressor.predict` returns a flat list, but `sc_y` was fitted on a column. Recent scikit-learn versions raise an error unless you add `.reshape(-1, 1)`, as the notebook does."], "tryThis": ["In the training cell, change `SVR(kernel = 'rbf')` to `SVR(kernel = 'rbf', epsilon = 0.5)`, then rerun the training, prediction and both chart cells. What to notice: a wider tube means more points count as \"close enough\", so the curve gets flatter and lazier and the 6.5 prediction moves away from about $170,370.", "Change it to `SVR(kernel = 'rbf', C = 100)` and rerun the same cells. What to notice: a larger `C` punishes points outside the tube more strongly, so the curve tries harder to reach the dots, including the CEO at level 10.", "Change `kernel = 'rbf'` to `kernel = 'linear'` and rerun. What to notice: the curve becomes a straight line, much like the poor linear baseline in the polynomial notebook. The kernel is what lets SVR bend.", "In the training cell, change `regressor.fit(X, y)` to `regressor.fit(X, y.ravel())`. What to notice: the `DataConversionWarning` disappears, but the printed settings and the 6.5 prediction stay the same. The warning was only about the shape of y."], "quiz": [{"q": "Why does this notebook scale y (the salaries) when most notebooks only scale X?", "a": "SVR works with distances and a fixed tube width (`epsilon=0.1`). That width only makes sense if salaries are on a small scale like the inputs. Linear regression doesn't need this because its multipliers adjust to any size of number."}, {"q": "In the first chart, the blue line falls well short of the red dot at level 10. Why?", "a": "The CEO's $1,000,000 salary is far from all the others, so SVR treats it like an outlier. Rather than bending the whole curve to reach one point, it keeps a smooth curve that fits the other nine well."}, {"q": "Reading the prediction line from the inside out, what are the three steps, and why is each needed?", "a": "First `sc_X.transform([[6.5]])` puts the level into the scaled units the model was trained on. Then `regressor.predict` gives a salary in scaled units. Finally `sc_y.inverse_transform` turns that back into dollars (about $170,370)."}, {"q": "What would happen if you removed the feature scaling cell and trained SVR on raw levels and raw salaries?", "a": "The fit would be very poor. The tube of width 0.1 would be tiny compared with salaries in the hundreds of thousands, and the rbf kernel's distances would be on the wrong scale, so the curve would not follow the data."}]}, {"id": "decision_tree_regression", "title": "Decision Tree Regression", "part": "Regression", "partNo": "Part 2", "section": "Section 8 - Decision Tree Regression", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%202%20-%20Regression/Section%208%20-%20Decision%20Tree%20Regression/Python/decision_tree_regression.ipynb", "summary": "Decision tree regression splits the data with a series of yes/no questions and predicts the average value of the training rows that end up in the same final group.", "whenToUse": "Reach for it when you have several inputs with messy, non-linear effects and want rules a human can read, but a single tree overfits easily and can't predict values outside the range it has seen.", "readFirst": "**polynomial_regression** and **support_vector_regression**: they use the same salary data, so you can compare a smooth curve with the tree's staircase.", "terms": ["decision tree", "split (cut-off)", "leaf", "random_state", "max_depth", "staircase prediction"], "mistakes": ["**Plotting only the 10 real levels.** `plt.plot(X, regressor.predict(X))` joins the 10 predictions with slopes and makes the tree look like a smooth line. Use a fine grid like the notebook's `np.arange(min(X), max(X), 0.01)` to see the real staircase.", "**Letting the tree grow without limits on real data.** With the defaults (`max_depth=None`, `min_samples_leaf=1`) the tree keeps splitting until every leaf holds one row, so it simply memorises the training data. On bigger datasets set `max_depth` or `min_samples_leaf` to stop it overfitting.", "**Expecting the tree to extrapolate.** A tree can only return salaries it has seen (leaf averages). Ask for level 15 and it returns the CEO's $1,000,000, not a higher number. Don't use it to predict beyond the range of your data.", "**Scaling the data \"just in case\".** Trees only compare values to cut-offs, so scaling changes nothing but adds steps and makes predictions harder to read. You can skip it here, unlike in SVR."], "tryThis": ["In the training cell, change `DecisionTreeRegressor(random_state = 0)` to `DecisionTreeRegressor(max_depth = 2, random_state = 0)`, then rerun the training, prediction and chart cells. What to notice: the staircase has only a few wide steps, and the 6.5 prediction is now an average of several jobs instead of exactly $150,000.", "In the prediction cell, change `[[6.5]]` to `[[6.4]]`, then `[[6.6]]`, then `[[15]]`. What to notice: 6.4 still gives $150,000 but 6.6 jumps to level 7's $200,000, because the cut-off sits at 6.5. Level 15 just returns the CEO's salary; a tree can't go beyond what it has seen.", "In the chart cell, change the step `0.01` in `np.arange(min(X), max(X), 0.01)` to `1`. What to notice: with only whole levels, the blue line joins the dots with slopes and the staircase disappears, which is why the notebook uses tiny steps.", "Try `DecisionTreeRegressor(min_samples_leaf = 3, random_state = 0)` and rerun. What to notice: each leaf must hold at least 3 jobs, so the steps get wider and the model stops copying each salary exactly."], "quiz": [{"q": "Why does the tree predict exactly $150,000 for level 6.5?", "a": "Each leaf holds one job here, and the cut-off between levels 6 and 7 is at 6.5. \"6.5 or less\" falls into level 6's leaf, so the tree returns the Region Manager's $150,000 unchanged. It never blends neighbours."}, {"q": "Why doesn't this notebook use feature scaling?", "a": "A tree only asks \"is this value above or below a cut-off?\". Whether levels are 1 to 10 or -1.57 to 1.57, the same rows end up on the same side, so the size of the numbers doesn't matter."}, {"q": "In the chart, what does the staircase shape of the blue line tell you?", "a": "Every level inside a step gets the same predicted salary, and the jumps happen halfway between real levels. That is what a tree does: it splits the input into ranges and gives each range one fixed answer."}, {"q": "What would happen if you set `max_depth = 1`?", "a": "The tree could ask only one question, so it would have just two leaves. The chart would show a single jump, and every level would get one of two average salaries."}]}, {"id": "random_forest_regression", "title": "Random Forest Regression", "part": "Regression", "partNo": "Part 2", "section": "Section 9 - Random Forest Regression", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%202%20-%20Regression/Section%209%20-%20Random%20Forest%20Regression/Python/random_forest_regression.ipynb", "summary": "Random forest regression trains many decision trees on different random samples of the data and averages their predictions.", "whenToUse": "Reach for it as a strong, low-fuss default on tabular data with many inputs, since it handles non-linear patterns without scaling, but it is harder to explain than one tree and cannot predict outside the range of values it was trained on.", "readFirst": "**decision_tree_regression**: a random forest is many of those trees averaged together, so you need to know how one tree splits the data first.", "terms": ["ensemble", "n_estimators", "bootstrap sample", "sampling with replacement", "averaging predictions"], "mistakes": ["**Leaving out `random_state` and then being confused by changing results.** Each tree gets a random sample, so without `random_state = 0` the 6.5 prediction can change every time you rerun. Fix the seed when you want repeatable results.", "**Thinking more trees always fixes everything.** Raising `n_estimators` makes the answer steadier, but after a point it only adds training time. More trees cannot fix bad or too-little data, and with just 10 rows the forest is still guessing.", "**Expecting the forest to predict beyond the data.** It averages tree answers, and each tree can only return salaries it has seen. So no level, however high, gets a prediction above $1,000,000. Don't use it to extrapolate.", "**Plotting only the 10 real levels.** Like a single tree, the forest's output is a staircase. Plotting `regressor.predict(X)` at the 10 levels hides that; use the fine `X_grid` the notebook builds."], "tryThis": ["In the training cell, change `n_estimators = 10` to `n_estimators = 100`, then rerun the training, prediction and chart cells. What to notice: the 6.5 prediction moves away from $167,000, and the staircase gets many more, smaller steps.", "Change `n_estimators = 10` to `n_estimators = 1` and rerun. What to notice: the forest is now a single tree trained on a random sample, so its staircase can look odd, with some levels missing because they weren't in that sample.", "Keep 10 trees but change `random_state = 0` to `random_state = 1`, then `2`, and rerun the prediction each time. What to notice: the 6.5 answer changes, because each seed gives the trees different samples. More trees make this wobble smaller.", "In the prediction cell, change `[[6.5]]` to `[[15]]`. What to notice: the answer is no higher than the CEO's $1,000,000, because averaging trees can never go beyond salaries seen in training."], "quiz": [{"q": "Why does the forest predict about $167,000 for level 6.5 while the single tree said exactly $150,000?", "a": "The forest averages 10 trees, each trained on a different random sample. Some trees put 6.5 into level 6's group ($150,000), others into a higher one such as level 7's ($200,000), so the average lands in between."}, {"q": "Why is each tree trained on a random sample instead of all the data?", "a": "If every tree saw the same rows, they would all be identical and averaging them would add nothing. Different samples give different trees, and their mistakes partly cancel out when averaged."}, {"q": "The printout shows `bootstrap=True`. What does that mean for each tree's data?", "a": "Each tree gets 10 rows drawn with replacement, like pulling names from a hat and putting each back. So some levels appear twice in a tree's sample and others are left out."}, {"q": "What would happen to the chart if you set `n_estimators = 1`?", "a": "The forest would be a single tree trained on one random sample, so the staircase would look like one tree's, possibly with odd steps where levels were left out of the sample. You lose the smoothing effect of averaging."}]}, {"id": "logistic_regression", "title": "Logistic Regression", "part": "Classification", "partNo": "Part 3", "section": "Section 14 - Logistic Regression", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%203%20-%20Classification/Section%2014%20-%20Logistic%20Regression/Python/logistic_regression.ipynb", "summary": "Logistic regression turns a weighted sum of the inputs into a probability between 0 and 1 using an S-curve, and predicts \"yes\" when that probability is above 50%.", "whenToUse": "Reach for it as a fast, easy-to-explain first model for yes/no questions (will this customer buy, is this email spam), but remember it can only draw a straight dividing line, so it misses patterns that curve.", "readFirst": "data_preprocessing_template (for the split and feature scaling steps) and multiple_linear_regression (logistic regression is the same \"base + multipliers × inputs\" sum, just pushed through an S-curve).", "terms": ["classification", "probability", "sigmoid (s-curve)", "decision boundary", "confusion matrix", "accuracy"], "mistakes": ["**Thinking \"regression\" means it predicts a number.** Despite the name, logistic regression answers yes/no questions: it outputs a probability and then a 0 or 1. If you want to predict an actual amount (like a salary), use the regression models from Part 2 instead.", "**Forgetting to scale a new person before predicting.** Writing `classifier.predict([[30,87000]])` feeds raw age and salary to a model that only ever saw scaled numbers (roughly -2 to +2), so the answer is meaningless. Always wrap new data in `sc.transform(...)`, exactly as the notebook does.", "**Calling `fit_transform` on the test set.** `X_test = sc.fit_transform(X_test)` lets the scaler learn a fresh average and spread from the test people, so the two sets are no longer measured with the same ruler and the test is no longer truly \"unseen\". Fit the scaler on the training set only, then use `sc.transform(X_test)`.", "**Judging the model on accuracy alone.** 89% sounds great, but the confusion matrix shows 8 of the 32 real buyers were missed. Always look at *which* mistakes are made, because a missed buyer and a false alarm can cost very different amounts in real life."], "tryThis": ["In the \"Predicting a new result\" cell, replace `print(classifier.predict(sc.transform([[30,87000]])))` with `print(classifier.predict_proba(sc.transform([[30,87000]])))`. What to notice: you get two numbers that add up to 1: the chance of \"won't buy\" and the chance of \"will buy\". The prediction `[0]` simply means the first number is bigger than 0.5.", "Still in that cell, try a few other people, e.g. `[[50,120000]]` and `[[22,30000]]`, with both `predict` and `predict_proba`. What to notice: older, higher-earning people get a higher \"will buy\" probability, matching the green area in the top-right of the chart.", "Add a new cell after training with `print(classifier.coef_, classifier.intercept_)`. What to notice: these are the multipliers *a* (Age) and *b* (Salary) and the base amount from the formula in the intro. Both multipliers should be positive, meaning more age and more salary both push the chance of buying up. (They are in scaled units, so compare them to each other, not to real ages or salaries.)", "In the split cell, change `test_size = 0.25` to `test_size = 0.4`, then re-run every cell down to the confusion matrix. What to notice: the matrix now adds up to 160 people instead of 100, and the accuracy changes slightly. A single accuracy number depends on which people happened to land in the test set."], "quiz": [{"q": "Why does logistic regression need the S-curve at all? Why not just use the straight-line sum directly?", "a": "The sum \"base + a × Age + b × Salary\" can be any number, like -7 or 250, which makes no sense as a chance of buying. The S-curve squashes it into the 0-to-1 range so it can be read as a probability, and then 0.5 becomes the natural cut-off between \"won't buy\" and \"will buy\"."}, {"q": "The confusion matrix is `[[65 3] [8 24]]`. How many real buyers were in the test set, and how many of them did the model catch?", "a": "Real buyers are the second row: 8 + 24 = 32. The model caught 24 of them and missed 8. So it found exactly 75% of the buyers, even though overall accuracy is 89%."}, {"q": "Why is the boundary between the red and green areas a perfectly straight line?", "a": "The model says \"will buy\" when the probability is above 50%, which happens exactly when the score \"base + a × Age + b × Salary\" is above 0. The set of points where that score equals 0 is a straight line on an age/salary chart, so the boundary can never bend."}, {"q": "What would happen if you deleted the feature scaling cell and trained on raw ages and salaries?", "a": "Salary values (tens of thousands) would dwarf age values (tens), so salary would dominate the sum and training would be slower and less balanced; you may even see a warning that training didn't finish (it is capped at 100 steps). You'd also have to remove the `sc.transform` calls in later cells, or they would fail because `sc` no longer exists."}]}, {"id": "k_nearest_neighbors", "title": "K-Nearest Neighbors (K-NN)", "part": "Classification", "partNo": "Part 3", "section": "Section 15 - K-Nearest Neighbors (K-NN)", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%203%20-%20Classification/Section%2015%20-%20K-Nearest%20Neighbors%20(K-NN)/Python/k_nearest_neighbors.ipynb", "summary": "K-NN classifies a new case by finding the K most similar cases it has already seen and letting them vote.", "whenToUse": "Use it on small to medium datasets where similar things tend to have similar labels and the boundary may be irregular, but it gets slow and less reliable with lots of rows or many input columns, and it needs scaled data.", "readFirst": "logistic_regression, because it uses the same ads dataset, the same steps, and the same confusion matrix, so you can compare K-NN's 93% directly with its 89%.", "terms": ["nearest neighbours", "k (number of neighbours)", "majority vote", "euclidean distance", "lazy learner"], "mistakes": ["**Skipping feature scaling.** K-NN picks neighbours by distance, so without scaling a salary gap of 1,000 counts far more than an age gap of 30 years, and age is effectively ignored. For K-NN, scaling isn't optional: always scale before fitting.", "**Forgetting to scale a new person before predicting.** Writing `classifier.predict([[30,87000]])` feeds raw age and salary to a model that only ever saw scaled numbers (roughly -2 to +2), so the answer is meaningless. Always wrap new data in `sc.transform(...)`, exactly as the notebook does.", "**Picking K = 1 because it scores perfectly on the training set.** With K = 1 every training person is their own nearest neighbour, so training accuracy looks perfect, but the boundary follows every odd person and does worse on new people. Judge K on the test set, and prefer an odd number to avoid tied votes.", "**Expecting K-NN to be fast at prediction time.** `.fit()` is instant because it only stores the data, but every prediction searches all stored people for the closest ones. On big datasets (or the fine grid in the charts) this gets slow, which is why this notebook uses `step = 1` for the plots."], "tryThis": ["In the training cell, change `n_neighbors = 5` to `n_neighbors = 1`, then re-run the cells down to the training-set chart. What to notice: the red/green border becomes jagged, with small islands around individual people. The confusion matrix will usually get worse, because the model is now copying single odd cases.", "Now try `n_neighbors = 25` (and then something big like `101`). What to notice: the border gets smoother and simpler, and with very large K it starts to ignore small pockets of buyers. Compare the confusion matrices to see where the sweet spot is.", "In the \"Predicting a new result\" cell, add a line `print(classifier.kneighbors(sc.transform([[30,87000]])))`. What to notice: it prints the distances to, and the row numbers of, the 5 closest training people. Look up their answers with `print(y_train[classifier.kneighbors(sc.transform([[30,87000]]))[1]])` and you can count the vote yourself.", "In the training cell, change `p = 2` to `p = 1` (\"city-block\" distance: walk along age, then along salary, instead of cutting diagonally). Re-run down to the confusion matrix. What to notice: the predictions may shift a little, showing that how you measure \"closeness\" changes who counts as a neighbour."], "quiz": [{"q": "Why is `.fit()` almost instant for K-NN, while predicting is slow?", "a": "K-NN doesn't learn a formula. Fitting just stores the 300 training people. All the work happens when you predict: for each new person it has to measure the distance to every stored person and find the 5 closest."}, {"q": "The K-NN confusion matrix is `[[64 4] [3 29]]`, while logistic regression's was `[[65 3] [8 24]]`. What is the main difference?", "a": "K-NN misses far fewer buyers: 3 instead of 8. It pays for this with one extra false alarm (4 instead of 3). Overall that lifts accuracy from 89% to 93%."}, {"q": "Why is the K-NN boundary curvy and irregular rather than a straight line?", "a": "There is no single formula behind it. Each spot on the chart is coloured by whatever its 5 nearest training people mostly did, so the border bends wherever the local mix of buyers and non-buyers changes."}, {"q": "What would happen if you set `n_neighbors = 300`, the size of the whole training set?", "a": "Every prediction would ask all 300 training people and take the majority. Since most of them didn't buy, the model would say \"won't buy\" for everyone, the whole chart would turn red, and every real buyer in the test set would be missed."}]}, {"id": "support_vector_machine", "title": "Support Vector Machine (SVM)", "part": "Classification", "partNo": "Part 3", "section": "Section 16 - Support Vector Machine (SVM)", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%203%20-%20Classification/Section%2016%20-%20Support%20Vector%20Machine%20(SVM)/Python/support_vector_machine.ipynb", "summary": "A linear SVM finds the straight line that separates two groups with the widest possible gap and classifies new cases by which side they fall on.", "whenToUse": "Use it when the two groups are roughly separable by a straight line (or flat surface), especially with many input columns such as text features, but it can only draw straight boundaries and gets slow on very large datasets.", "readFirst": "logistic_regression (same data, steps and confusion matrix, also a straight-line model) and support_vector_regression (same SVM idea of a margin, used there for numbers).", "terms": ["support vector machine (svm)", "margin", "support vectors", "linear kernel", "c (regularisation)"], "mistakes": ["**Skipping feature scaling.** An SVM measures distances from people to the line, so unscaled salary (tens of thousands) would swamp age. Training also gets much slower. Always scale before fitting an SVM.", "**Forgetting to scale a new person before predicting.** Writing `classifier.predict([[30,87000]])` feeds raw age and salary to a model that only ever saw scaled numbers (roughly -2 to +2), so the answer is meaningless. Always wrap new data in `sc.transform(...)`, exactly as the notebook does.", "**Expecting a linear SVM to beat logistic regression by a lot.** Both draw a straight line, so on this data they make almost the same mistakes (90% vs 89%, both missing 8 buyers). If the groups aren't split by a straight line, change the kernel (next notebook), not just the model name.", "**Treating `C` as \"higher is always better\".** A very large `C` forces the model to avoid training mistakes at almost any cost, which can tilt the line to fit a few odd people. A smaller `C` accepts a few mistakes for a wider, steadier gap. Compare test results when you change it."], "tryThis": ["Add a new cell after training with `print(classifier.n_support_)` and `print(sc.inverse_transform(classifier.support_vectors_))`. What to notice: only some of the 300 training people are support vectors (the first line gives the count for each class), and they are the people sitting near the boundary. The rest have no say in where the line goes.", "In the training cell, change `SVC(kernel = 'linear', random_state = 0)` to `SVC(kernel = 'linear', C = 0.01, random_state = 0)`, then re-run down to the training chart. What to notice: with a very relaxed road the line can shift, and the confusion matrix changes. Then try `C = 100` and compare; the line moves less than you might expect because most people are far from it.", "In the \"Predicting a new result\" cell, add `print(classifier.decision_function(sc.transform([[30,87000]])))`. What to notice: you get a single score. Negative means the \"won't buy\" side of the line, positive means \"will buy\", and the further from 0, the further the person is from the line.", "Copy the confusion matrix from the logistic regression notebook (`[[65 3] [8 24]]`) and compare it with this one. What to notice: the only difference is one false alarm turned into a correct answer. Both straight-line models still miss the same number of buyers."], "quiz": [{"q": "Why does an SVM look for the line with the widest gap, instead of any line that separates the groups?", "a": "A line that barely squeezes between the groups is fragile: a new person only slightly different from the training data could land on the wrong side. Leaving the most room on both sides gives a safety buffer, which tends to work better on people the model hasn't seen."}, {"q": "What are support vectors, and why do they matter?", "a": "They are the training people closest to the edges of the \"road\" (or inside it). Only they decide where the line goes; you could delete all the other training people and get the same line."}, {"q": "The confusion matrix is `[[66 2] [8 24]]`. How many false alarms and missed buyers are there, and what is the accuracy?", "a": "2 false alarms (didn't buy, predicted buy) and 8 missed buyers (bought, predicted won't buy). Correct answers are 66 + 24 = 90 out of 100, so accuracy is 0.9, or 90%."}, {"q": "What would happen if you changed `kernel = 'linear'` to `kernel = 'rbf'`?", "a": "The boundary would no longer have to be straight and could curve around the group of buyers. That is exactly what the Kernel SVM notebook does, and there the missed buyers drop from 8 to 3."}]}, {"id": "kernel_svm", "title": "Kernel SVM", "part": "Classification", "partNo": "Part 3", "section": "Section 17 - Kernel SVM", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%203%20-%20Classification/Section%2017%20-%20Kernel%20SVM/Python/kernel_svm.ipynb", "summary": "Kernel SVM is an SVM that measures similarity in a smarter way, such as the RBF kernel, so it can draw a curved boundary between groups instead of a straight line.", "whenToUse": "Reach for it when the classes are separated by a curved or patchy border and the dataset is small to medium, but it needs scaled data, careful tuning of `C` and `gamma`, and becomes slow on very large datasets.", "readFirst": "support_vector_machine, because this notebook is the same code with one change, `kernel = 'rbf'` instead of `'linear'`, and the point is to compare the two.", "terms": ["kernel", "kernel trick", "rbf (gaussian) kernel", "gamma", "non-linear boundary"], "mistakes": ["**Skipping feature scaling.** The RBF kernel measures closeness by distance, so unscaled salary would swamp age and the curved boundary would effectively depend on salary alone. Always scale before an RBF SVM.", "**Forgetting to scale a new person before predicting.** Writing `classifier.predict([[30,87000]])` feeds raw age and salary to a model that only ever saw scaled numbers (roughly -2 to +2), so the answer is meaningless. Always wrap new data in `sc.transform(...)`, exactly as the notebook does.", "**Cranking `gamma` or `C` up to get a perfect training chart.** A large `gamma` makes each person's \"bubble of influence\" tiny, so the boundary wraps around individuals and forms islands; a large `C` punishes every training mistake. Both can fit the training set beautifully and do worse on the test set. Always judge on the test results.", "**Assuming the kernel actually builds the 3D (or higher) data.** The kernel trick is a shortcut: it computes how similar two people are *as if* they had been lifted into more dimensions, without creating those extra columns. You won't find new columns in `X_train`, and you don't need to add any."], "tryThis": ["In the training cell, change `SVC(kernel = 'rbf', random_state = 0)` to `SVC(kernel = 'rbf', gamma = 50, random_state = 0)`, then re-run down to the test-set chart. What to notice: the green area breaks into small blobs around individual buyers. The training chart looks great but the test confusion matrix usually gets worse: this is overfitting. Then try `gamma = 0.05` and watch the boundary become almost straight.", "Try `SVC(kernel = 'rbf', C = 100, random_state = 0)` and then `C = 0.1`. What to notice: high C bends the curve harder to grab every training person; low C gives a smoother, looser boundary. Compare the two confusion matrices against the default `[[64 4] [3 29]]`.", "Try the other kernels: `kernel = 'poly'` and `kernel = 'sigmoid'`. What to notice: each kernel gives a differently shaped boundary and a different confusion matrix. The choice of kernel matters as much as the choice of model.", "Add a cell after training with `print(classifier.n_support_)`, then do the same in the linear SVM notebook. What to notice: the number of support vectors is different, because with a curved boundary a different set of people end up near the edge."], "quiz": [{"q": "In plain words, what does the kernel trick do?", "a": "It lets a straight-line method draw a curved boundary. Imagine lifting the dots off the page so buyers float up and non-buyers stay low; a flat sheet can now slide between them, and seen from above its edge looks curved. The kernel does this with a mathematical shortcut, without ever building the extra dimensions."}, {"q": "The confusion matrix is `[[64 4] [3 29]]`, while the linear SVM gave `[[66 2] [8 24]]`. What did the curve gain, and what did it cost?", "a": "It caught 5 more buyers (missed buyers fell from 8 to 3) but made 2 more false alarms (2 rose to 4). Overall, correct answers went from 90 to 93, so accuracy rose from 90% to 93%."}, {"q": "Why is this notebook's code almost identical to the linear SVM notebook?", "a": "It is the same `SVC` model, and the only change is `kernel = 'rbf'` instead of `'linear'`. The kernel decides how \"similarity\" between people is measured, and that alone changes the boundary from a straight line to a smooth curve."}, {"q": "What would happen if you set a very large `gamma`, like `gamma = 100`?", "a": "Each training person's bubble of influence would become tiny, so the green area would shrink into small islands around individual buyers. The model would nearly memorise the training set but would generalise poorly, so the test-set mistakes would usually go up."}]}, {"id": "naive_bayes", "title": "Naive Bayes", "part": "Classification", "partNo": "Part 3", "section": "Section 18 - Naive Bayes", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%203%20-%20Classification/Section%2018%20-%20Naive%20Bayes/Python/naive_bayes.ipynb", "summary": "Naive Bayes predicts a class by asking how typical a person's features are for each group, multiplying those chances together with how common each group is, and picking the group with the bigger score.", "whenToUse": "Reach for it when you want a very fast, simple baseline, especially for text tasks like spam filtering with many features; its weakness is that it ignores links between features, so its probability estimates can be overconfident.", "readFirst": "**logistic_regression** (it sets up this same dataset, the train/test split, the confusion matrix and the red/green charts), and ideally **kernel_svm**, so you can compare a smooth curved boundary from a very different method.", "terms": ["naive bayes", "bayes' theorem", "prior probability", "likelihood", "gaussian (bell curve)", "independence assumption"], "mistakes": ["**Thinking \"naive\" means \"bad\".** The word only refers to the assumption that age and salary are unrelated clues. Even though that is rarely true, the model still scored 90% here, so judge it by its test results, not its name.", "**Using `GaussianNB` on any kind of data.** `GaussianNB` assumes each column looks roughly like a bell curve. For word counts (as in the later natural_language_processing notebook) or yes/no columns, the `MultinomialNB` or `BernoulliNB` versions usually fit much better.", "**Calling `classifier.predict([[30,87000]])` without `sc.transform`.** The model learned from scaled numbers, so a raw salary of 87,000 looks absurdly huge to it and the answer is meaningless. Always scale new people with the same `sc` first, as the notebook does.", "**Trusting the predicted probabilities too much.** Naive Bayes is often right about *which* class wins but overconfident about *how sure* it is (e.g. saying 0.99 when the truth is closer to 0.7), because multiplying clues that are actually linked double-counts the evidence. Use the label, and treat the exact probabilities with caution."], "tryThis": ["Add a new cell after the \"Predicting a new result\" cell with `print(classifier.predict_proba(sc.transform([[30,87000]])))`. What to notice: you get two numbers that add up to 1, the chance of \"didn't buy\" and the chance of \"bought\". The `[0]` answer from `predict` is simply whichever of the two is bigger.", "In a new cell after training, run `print(classifier.class_prior_)` and `print(classifier.theta_)`. What to notice: `class_prior_` is the share of non-buyers and buyers in the 300 training people (the \"how common are buyers overall\" part), and `theta_` holds the average scaled age and salary for each group. Buyers should have clearly higher averages, which is why the green area sits towards the top right.", "Change the training cell to `classifier = GaussianNB(priors = [0.5, 0.5])` and re-run it and every cell below. What to notice: you are telling the model to assume buyers and non-buyers are equally common. Watch the confusion matrix: the 7 missed buyers should usually go down while the false alarms go up, because the model is now more willing to say \"yes\".", "Try a few more people in the prediction cell, e.g. `print(classifier.predict(sc.transform([[30,87000], [45,60000], [55,140000], [22,30000]])))`. What to notice: one answer per person. Check each against the chart: older and/or richer people should land in the green area."], "quiz": [{"q": "Why is it called \"naive\" Bayes?", "a": "Because it naively assumes the clues (here age and salary) have nothing to do with each other, so it can just multiply their separate chances together. In real life older people tend to earn more, so the assumption is not quite true, but the shortcut keeps the model simple and fast and it still works well."}, {"q": "The confusion matrix is `[[65 3] [7 25]]`. How many mistakes did the model make, and which kind was more common?", "a": "10 mistakes in total. 3 were false alarms (said \"bought\" for someone who didn't) and 7 were missed buyers (said \"didn't buy\" for someone who did), so missing buyers was the more common mistake."}, {"q": "Why does training `GaussianNB` take almost no time?", "a": "There is no trial and error or repeated adjusting. For buyers and non-buyers separately it just calculates the average and spread of age and salary, plus the share of each group, which is a handful of simple sums."}, {"q": "What would happen if you asked about a person far outside the training data, say aged 95?", "a": "The model would still give an answer, because a bell curve never quite reaches zero. It compares how far out on each group's curve the person sits; since buyers are on average older, it would very likely say \"bought\", even though it has never seen anyone that age, so that answer deserves little trust."}]}, {"id": "decision_tree_classification", "title": "Decision Tree Classification", "part": "Classification", "partNo": "Part 3", "section": "Section 19 - Decision Tree Classification", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%203%20-%20Classification/Section%2019%20-%20Decision%20Tree%20Classification/Python/decision_tree_classification.ipynb", "summary": "A decision tree classifies a new case by asking a chain of yes/no questions about its features, each chosen to separate the classes as cleanly as possible, until it reaches a final answer.", "whenToUse": "Reach for it when you need a model you can explain to people as simple rules (like a loan or triage checklist); its main limitation is that an unlimited tree overfits easily and changes a lot with small changes in the data.", "readFirst": "**decision_tree_regression** (the same idea of splitting data with yes/no questions, but predicting numbers) and **logistic_regression** (for the dataset, confusion matrix and red/green charts used here).", "terms": ["decision tree", "split", "entropy", "leaf", "max_depth", "overfitting"], "mistakes": ["**Leaving the tree unlimited and trusting the training chart.** With no `max_depth`, the tree keeps splitting until every group is pure, so it gets almost every training dot right and grows little islands around single people. That looks great but is memorising; always judge it on the test set and consider setting `max_depth` or `min_samples_leaf`.", "**Thinking scaling is required (or that it helps).** A tree only asks \"is this value above or below a cut-off?\" about one column at a time, so units don't matter. The notebook scales only to keep the code and charts consistent with the other notebooks; skipping it would give the same kind of tree.", "**Reading too much into one tree.** Small changes to the training data (a different `random_state` in `train_test_split`, a few extra people) can produce a quite different tree and different boxes. That instability is exactly why random forests come next in the course.", "**Forgetting `sc.transform` on new people.** Because this notebook trained on scaled data, the cut-offs inside the tree are in scaled units. Passing raw `[[30,87000]]` straight to `predict` compares 87,000 against cut-offs near 0, giving nonsense."], "tryThis": ["In the training cell change it to `classifier = DecisionTreeClassifier(criterion = 'entropy', max_depth = 3, random_state = 0)` and re-run it and all cells below. What to notice: the charts turn into a few big boxes with no tiny islands. Compare the new confusion matrix with `[[62 6] [3 29]]` to see whether a simpler tree does as well or better on unseen people.", "Add a cell after training with `from sklearn.metrics import accuracy_score` and `print(accuracy_score(y_train, classifier.predict(X_train)))`. What to notice: with no depth limit, training accuracy is at or very close to 1.0 (100%), far higher than the 0.91 on the test set. That gap is what overfitting looks like in numbers.", "Add a new cell after training: `from sklearn.tree import export_text` then `print(export_text(classifier, feature_names = ['Age', 'EstimatedSalary'], max_depth = 2))`. What to notice: you can read the actual yes/no questions the tree asks. The cut-off values are in scaled units (around -2 to +2) because the tree was trained on scaled data.", "Change `criterion = 'entropy'` to `criterion = 'gini'` and re-run from the training cell down. What to notice: Gini is a different way of measuring how mixed a group is. The confusion matrix may change a little, but usually not much, which shows the choice of measure matters less than things like depth."], "quiz": [{"q": "What does entropy measure, and how does the tree use it?", "a": "Entropy measures how mixed a group is: 0 means everyone in it is a buyer (or everyone is a non-buyer), and a 50/50 mix is the most mixed. At each step the tree picks the question whose answer leaves the two resulting groups as unmixed (pure) as possible."}, {"q": "The confusion matrix is `[[62 6] [3 29]]`. How many false alarms and how many missed buyers were there, and what is the accuracy?", "a": "6 false alarms (people who didn't buy but were predicted to) and 3 missed buyers. Correct answers are 62 + 29 = 91 out of 100, so accuracy is 0.91 (91%)."}, {"q": "Why are the coloured regions on the charts made of straight horizontal and vertical lines?", "a": "Every question in the tree looks at just one thing, either age or salary, and compares it to a cut-off. A cut on age is a vertical line on the chart and a cut on salary is a horizontal line, so the regions end up as rectangles."}, {"q": "What would happen if you set `max_depth = 1`?", "a": "The tree could ask only one question, so the chart would be split by a single straight line into one red and one green area. It would be very simple and stable, but it would likely get many people wrong, because buying depends on both age and salary together (this is called underfitting)."}]}, {"id": "random_forest_classification", "title": "Random Forest Classification", "part": "Classification", "partNo": "Part 3", "section": "Section 20 - Random Forest Classification", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%203%20-%20Classification/Section%2020%20-%20Random%20Forest%20Classification/Python/random_forest_classification.ipynb", "summary": "A random forest grows many decision trees, each on a random slice of the data, and lets them vote, so the final answer is whatever most trees say.", "whenToUse": "Reach for it as a strong, low-fuss default for table-style data when one decision tree is too jumpy; the trade-off is that a forest of many trees is slower and much harder to explain than a single tree's rules.", "readFirst": "**decision_tree_classification** (a forest is just many of those trees voting, and you'll compare results with it) and **random_forest_regression** (the same team-of-trees idea used to predict numbers).", "terms": ["random forest", "ensemble", "n_estimators", "bootstrap sample", "majority vote"], "mistakes": ["**Thinking more trees will always raise the accuracy a lot.** Adding trees mainly makes the forest steadier; after a point the score levels off and you just wait longer. Going from 10 to 100 trees is often worth it, going to 10,000 rarely is.", "**Expecting the forest to fix overfitting completely.** Each tree here still grows with no depth limit, so the training chart still shows small islands around single dots. Voting smooths this out somewhat, but settings like `max_depth` or `min_samples_leaf` still matter.", "**Comparing models on one lucky split.** The forest and the single tree both got 0.91 here, with a different mix of mistakes. With only 100 test people, one or two people can swing the score, so don't declare a winner from one run; k-fold cross-validation (later in the course) gives a fairer comparison.", "**Forgetting to scale the new person.** The forest was trained on scaled numbers, so `classifier.predict([[30,87000]])` without `sc.transform` feeds it a salary far off the scale its trees learned. Always use `sc.transform` as the notebook does."], "tryThis": ["In the training cell change `n_estimators = 10` to `n_estimators = 100` and re-run it and every cell below. What to notice: compare the new confusion matrix with `[[63 5] [4 28]]`. The chart's boundary may look a bit smoother, but the accuracy may barely move, showing that more trees mostly add stability.", "Change `n_estimators = 10` to `n_estimators = 1` and re-run from the training cell down. What to notice: a \"forest\" of one tree is just a single decision tree trained on a random sample of the data. Its charts look boxier and messier, and its confusion matrix is likely worse than the 10-tree forest's.", "Add a cell after training with `print(classifier.feature_importances_)`. What to notice: you get two numbers that add up to 1, one for Age and one for EstimatedSalary. They show how much each column helped the trees separate buyers from non-buyers.", "Add a cell after the \"Predicting a new result\" cell with `print(classifier.predict_proba(sc.transform([[30,87000]])))`. What to notice: the two numbers are (roughly) the share of the 10 trees that voted \"didn't buy\" and \"bought\". With 10 trees the values often move in steps of about 0.1, so you can see how close the vote was."], "quiz": [{"q": "Why does each tree in the forest see a different random sample of the training data?", "a": "If every tree saw exactly the same data, they would all grow the same way and make the same mistakes, so voting wouldn't help. Giving each tree its own random rows (and random columns to choose from at each question) makes them different, so their individual mistakes tend to cancel out."}, {"q": "The confusion matrix is `[[63 5] [4 28]]`. How does this compare with the single decision tree's `[[62 6] [3 29]]`?", "a": "Both got 91 out of 100 right (accuracy 0.91). The forest made one fewer false alarm (5 vs 6) but missed one more buyer (4 vs 3). So same score, different mix of mistakes."}, {"q": "What does `n_estimators = 10` control?", "a": "It sets how many decision trees are in the forest, here 10. Each tree votes for \"bought\" or \"didn't buy\", and the forest goes with the majority."}, {"q": "What would happen if you removed the feature scaling cell and the `sc.transform` calls?", "a": "The forest would work just about as well, because each tree only compares one column to a cut-off at a time, and changing the units doesn't change which side of a cut-off a person falls on. The notebook keeps scaling only so the code and plotting match the other classification notebooks."}]}, {"id": "k_means_clustering", "title": "K-Means Clustering", "part": "Clustering", "partNo": "Part 4", "section": "Section 24 - K-Means Clustering", "url": "https://github.com/ogjr80/mlproject/blob/main/Part%204%20-%20Clustering/Section%2024%20-%20K-Means%20Clustering/Python/k_means_clustering.ipynb", "summary": "K-Means splits data into K groups by repeatedly assigning each point to its nearest centre and moving each centre to the middle of its points.", "whenToUse": "Reach for it to segment customers, products or anything else into a handful of similar groups when you have no labels; one limitation is that you must choose K yourself, and it works best when the groups are roughly round blobs of similar size.", "readFirst": "**k_nearest_neighbors** (the idea of measuring straight-line distance between dots) and **data_preprocessing_tools** (how `iloc` picks columns). Everything before this notebook was supervised; this is the first one with no `y` column.", "terms": ["unsupervised learning", "cluster", "centroid", "wcss (inertia)", "elbow method", "k-means++"], "mistakes": ["**Picking K from the lowest point of the elbow chart.** WCSS always keeps dropping as K grows, so the lowest point is always K = 10 and means nothing. Look for the bend where the line goes from steep to flat (here, 5).", "**Treating cluster numbers as meaningful.** Cluster 0 is not \"better\" or \"first\" in any sense; the numbers are just name tags. Change `random_state` and the same groups can come back with different numbers, so describe clusters by what is in them (e.g. \"high income, low spending\"), not by their number.", "**Feeding in columns on very different scales.** K-Means uses straight-line distance, so a column measured in big numbers drowns out one in small numbers. Here income (roughly 15 to 140) and spending score (1 to 100) are similar in size, so it works; with other data, apply feature scaling first.", "**Adding more columns but keeping the same plot.** If you change `iloc[:, [3, 4]]` to include Age, the scatter cell still only draws columns 0 and 1 of `X`, so the picture no longer shows everything the clusters were based on and can look messy even when the clustering is fine."], "tryThis": ["In a new cell under the elbow chart, run `print(wcss)`. What to notice: the numbers fall fast at first and then only a little each step; compare the drop from 4 to 5 clusters with the drop from 5 to 6 to see the elbow in numbers rather than by eye.", "In the training cell, change `KMeans(n_clusters = 5, ...)` to `n_clusters = 3`, then delete (or comment out) the cyan and magenta `plt.scatter` lines in the plotting cell. What to notice: some of the five natural blobs get glued together into bigger groups, and some yellow centroids end up in the gaps between blobs instead of in their middles.", "In the training cell, change `random_state = 42` to `random_state = 0` and re-run the training and plotting cells. What to notice: the colours may swap around (cluster numbers are arbitrary), but the same five groups of customers should appear, because `k-means++` gives a sensible start.", "In a new cell after training, run `print(kmeans.cluster_centers_)`. What to notice: you get 5 rows of (income, spending score) pairs. These are the yellow dots, and each one is a short description of a typical customer in that group."], "quiz": [{"q": "Why is there no `y` in this notebook?", "a": "Because K-Means is unsupervised: there is no answer column to learn from. The algorithm invents the group labels itself, and `y_kmeans` is just its record of who ended up with whom."}, {"q": "On the elbow chart, why does WCSS keep going down as the number of clusters goes up?", "a": "WCSS adds up how far each customer is from their own centroid (squared). More centroids means everyone has a flag closer to them, so
