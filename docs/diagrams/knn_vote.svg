<text x="610" y="265" font-size="15" text-anchor="middle" fill="#3A9A5B" font-weight="bold">3 vs 2 → predict: buys</text>
<text x="490" y="316" font-size="14" text-anchor="start" fill="#222222">n_neighbors = 5 (the K).</text>
<text x="490" y="336" font-size="14" text-anchor="start" fill="#222222">“Nearest” = ordinary straight-</text>
<text x="490" y="354" font-size="14" text-anchor="start" fill="#222222">line distance on the chart.</text>
<text x="490" y="390" font-size="14" text-anchor="start" fill="#555555">Faded dots are too far</text>
<text x="490" y="408" font-size="14" text-anchor="start" fill="#555555">away to get a vote.</text>
