<circle cx="508" cy="344" r="7" fill="#3A9A5B" stroke="#FFFFFF" stroke-width="1.2"/>
<text x="524" y="349" font-size="14" text-anchor="start" fill="#222222">bought (1)</text>
<text x="500" y="386" font-size="14" text-anchor="start" fill="#555555">New people are classified by</text>
<text x="500" y="404" font-size="14" text-anchor="start" fill="#555555">which side of the line they fall.</text>
